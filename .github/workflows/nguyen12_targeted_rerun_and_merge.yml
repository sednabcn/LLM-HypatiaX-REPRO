# ==============================================================================
#  nguyen12_targeted_rerun_and_merge.yml
#
#  Reruns ONLY the specific Nguyen-12 equations flagged as unresolved by
#  fix_expression_trajectory_mismatch.py, for the four affected seeds, and
#  merges the results into the real multi-seed result files via
#  AUDIT/merge_targeted_rerun.py.
#
#  VERIFIED against github.com/sednabcn/LLM-HypatiaX-REPRO (this revision):
#    - The "8 unresolved records" list below was re-derived by actually
#      running AUDIT/fix_expression_trajectory_mismatch.py against the real
#      files in hypatiax/data/results/extrapolation/{,multi_seed/}. It
#      matches exactly: seed99=N12[pysr], seed123=N4[pysr],
#      seed777=N7+N12[pysr], seed2024=N8,N9[hypatiax]+N7,N9[pysr]. seed42
#      has 0 unresolved and is intentionally not in this workflow.
#    - exp3_nguyen12_hybrid50v_02_patched.py's fixed output filename
#      (exp3_nguyen12_seed{seed}.json) is written under a directory
#      resolved by _resolve_results_dir(): RESULTS_DIR env var if set,
#      otherwise a path derived from the SCRIPT's own file location via
#      pathlib -- NOT the process's current working directory. An earlier
#      draft of this workflow tried to isolate each seed's rerun with a
#      `working-directory:` step option; that does NOT work, since it has
#      no effect on _REPRO_ROOT/_results_dir resolution. Isolation must be
#      done by setting RESULTS_DIR explicitly per seed (confirmed against
#      the script source, and against the working pattern already used for
#      this in .github/workflows/_fixn3_temp_cell.yml).
#    - TASK_IDS format ("N1 N3 N7", space-separated) confirmed against the
#      script's own docstring and _apply_task_ids_nguyen().
#    - Dependency setup (Julia 1.11, requirements.txt, ANTHROPIC_API_KEY
#      live check via config/test_key_status.py) is copied from the
#      equivalent real step in _fixn3_temp_cell.yml, not guessed.
#
#  VERIFIED FIXES (2026-09-05):
#    - AUDIT/merge_targeted_rerun.py confirmed present and working.
#    - Added explicit expression/trajectory repair step after merge to fix
#      the bug where merged records may still contain the expression
#      mismatch that triggered the targeted rerun in the first place. The
#      merge itself just copies records; the repair script must be run
#      after to fix their expressions before validation.
#
#  RESTRUCTURED TO MATRIX (2026-09-06):
#    - Previously all four seeds ran sequentially as steps in ONE job, inside
#      ONE shared 240-minute budget. That meant (a) one very slow seed (e.g.
#      seed777/seed2024 at ~40min each even before the budget bump below)
#      could starve the others of remaining wall-clock, and (b) if the job
#      got cancelled/killed for ANY reason partway through (observed once,
#      cause never fully confirmed -- possibly a manual cancel, possibly a
#      concurrency/plan limit), ALL FOUR seeds' work was lost even if 3 of
#      them had already finished successfully, since nothing downstream had
#      run yet.
#    - Now each seed is its own independent matrix job on its own runner, with
#      its own timeout. A problem with one seed (cancelled, slow, crashed)
#      no longer affects the other three. `fail-fast: false` ensures that
#      explicitly -- one seed failing does not cancel the others.
#    - The merge/repair/check/commit steps move to a second job
#      (`merge-and-check`) that `needs:` all four matrix jobs and downloads
#      each seed's individual artifact before proceeding. This job still runs
#      once, sequentially, since the merge step's safety checks (seed
#      mismatch guard, task-id presence guard) and the commit step are
#      inherently single-writer operations.
# ==============================================================================

name: "Nguyen-12 targeted rerun + merge"

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      write:
        description: "Actually overwrite the real result files (unchecked = dry run only)"
        required: false
        default: false
        type: boolean

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # One independent worker per seed. A cancellation, crash, or slow run on
  # any one seed does NOT affect the other three (fail-fast: false), and
  # each gets its own timeout instead of sharing one 240-minute budget.
  # ────────────────────────────────────────────────────────────────────────
  targeted-rerun:
    name: "Targeted rerun (seed ${{ matrix.seed }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 99
            task_ids: "N12"
            label: "unresolved: N12 [pysr]"
            n_iterations: "2000"
            populations: "60"
            pysr_timeout: "2200"
            timeout_minutes: 90
          - seed: 123
            task_ids: "N4"
            label: "unresolved: N4 [pysr]"
            n_iterations: "1000"
            populations: "30"
            pysr_timeout: "1100"
            timeout_minutes: 60
          - seed: 777
            task_ids: "N7 N12"
            label: "unresolved: N7, N12 [pysr]"
            n_iterations: "2000"
            populations: "60"
            pysr_timeout: "2200"
            timeout_minutes: 90
          - seed: 2024
            task_ids: "N7 N8 N9"
            label: "unresolved: N8,N9 [hypatiax]; N7,N9 [pysr]"
            n_iterations: "2000"
            populations: "60"
            pysr_timeout: "2200"
            timeout_minutes: 90
    timeout-minutes: ${{ matrix.timeout_minutes }}

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Set up Julia 1.11
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"

      - name: Install experiment dependencies
        run: pip install -r requirements.txt

      - name: Validate ANTHROPIC_API_KEY (live round-trip)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          KEY_LEN=${#ANTHROPIC_API_KEY}
          echo "ANTHROPIC_API_KEY present: $([ $KEY_LEN -gt 0 ] && echo YES || echo NO)"
          if [[ $KEY_LEN -eq 0 ]]; then
            echo "::error::ANTHROPIC_API_KEY secret is empty or unset."
            exit 1
          fi
          python3 "${{ github.workspace }}/config/test_key_status.py"

      # ── Each seed gets its own RESULTS_DIR so the patched script's fixed
      # ── output filename (exp3_nguyen12_seed{seed}.json) can never collide
      # ── with a pre-existing file and silently no-op (see header note).
      - name: "Targeted rerun: seed ${{ matrix.seed }} (${{ matrix.label }})"
        env:
          RESULTS_DIR: ${{ github.workspace }}/scratch/seed${{ matrix.seed }}
          TASK_IDS: ${{ matrix.task_ids }}
          PYSR_SEED: "${{ matrix.seed }}"
          EXPERIMENT_SEED: "${{ matrix.seed }}"
          NN_SEED: "${{ matrix.seed }}"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          N_ITERATIONS: ${{ matrix.n_iterations }}
          POPULATIONS: ${{ matrix.populations }}
          PYSR_TIMEOUT: ${{ matrix.pysr_timeout }}
        run: |
          mkdir -p "${RESULTS_DIR}"
          python3 hypatiax/experiments/benchmarks/exp3_nguyen12_hybrid50v_02_patched.py --seed ${{ matrix.seed }}

      - name: "Upload seed ${{ matrix.seed }} rerun output"
        if: always()
        uses: actions/upload-artifact@v4.3.6
        with:
          name: nguyen12-rerun-seed-${{ matrix.seed }}-${{ github.run_id }}
          path: scratch/seed${{ matrix.seed }}/
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────
  # Runs once, after all four seeds have finished (successfully or not --
  # see `if:` below). Downloads each seed's artifact, merges into the real
  # multi-seed result files, repairs/validates, and commits.
  # ────────────────────────────────────────────────────────────────────────
  merge-and-check:
    name: "Merge all seeds into real result files"
    needs: targeted-rerun
    # Run even if one seed's matrix job failed/was cancelled, so the seeds
    # that DID succeed still get merged instead of being silently dropped.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Install experiment dependencies (numpy only, needed by AUDIT scripts)
        run: pip install numpy

      - name: "Confirm merge_targeted_rerun.py has been added to the repo"
        run: |
          if [[ ! -f "AUDIT/merge_targeted_rerun.py" ]]; then
            echo "::error::AUDIT/merge_targeted_rerun.py not found in this checkout."
            exit 1
          fi

      - name: "Download seed 99 rerun output"
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: nguyen12-rerun-seed-99-${{ github.run_id }}
          path: scratch/seed99/

      - name: "Download seed 123 rerun output"
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: nguyen12-rerun-seed-123-${{ github.run_id }}
          path: scratch/seed123/

      - name: "Download seed 777 rerun output"
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: nguyen12-rerun-seed-777-${{ github.run_id }}
          path: scratch/seed777/

      - name: "Download seed 2024 rerun output"
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: nguyen12-rerun-seed-2024-${{ github.run_id }}
          path: scratch/seed2024/

      - name: "Confirm which seeds actually produced output"
        run: |
          for f in scratch/seed99/exp3_nguyen12_seed99.json \
                   scratch/seed123/exp3_nguyen12_seed123.json \
                   scratch/seed777/exp3_nguyen12_seed777.json \
                   scratch/seed2024/exp3_nguyen12_seed2024.json ; do
            if [[ -f "$f" ]]; then
              echo "OK   -- $f present"
            else
              echo "::warning::MISSING -- $f -- that seed's matrix job did not produce output (failed/cancelled). It will be skipped in the merge below."
            fi
          done

      - name: "Merge targeted reruns into the real result files"
        run: |
          set -euo pipefail
          WRITE_FLAG=()
          if [ "${{ inputs.write }}" = "true" ]; then
            WRITE_FLAG=(--write)
          fi

          if [[ -f scratch/seed99/exp3_nguyen12_seed99.json ]]; then
            python3 AUDIT/merge_targeted_rerun.py \
              --source scratch/seed99/exp3_nguyen12_seed99.json \
              --target hypatiax/data/results/extrapolation/multi_seed/exp3_nguyen12_seed99_nshards01.json \
              --task-ids N12 "${WRITE_FLAG[@]}"
          fi

          if [[ -f scratch/seed123/exp3_nguyen12_seed123.json ]]; then
            python3 AUDIT/merge_targeted_rerun.py \
              --source scratch/seed123/exp3_nguyen12_seed123.json \
              --target hypatiax/data/results/extrapolation/multi_seed/exp3_nguyen12_seed123_nshards02.json \
              --task-ids N4 "${WRITE_FLAG[@]}"
          fi

          if [[ -f scratch/seed777/exp3_nguyen12_seed777.json ]]; then
            python3 AUDIT/merge_targeted_rerun.py \
              --source scratch/seed777/exp3_nguyen12_seed777.json \
              --target hypatiax/data/results/extrapolation/multi_seed/exp3_nguyen12_seed777_nshards03.json \
              --task-ids N7 N12 "${WRITE_FLAG[@]}"
          fi

          if [[ -f scratch/seed2024/exp3_nguyen12_seed2024.json ]]; then
            python3 AUDIT/merge_targeted_rerun.py \
              --source scratch/seed2024/exp3_nguyen12_seed2024.json \
              --target hypatiax/data/results/extrapolation/multi_seed/exp3_nguyen12_seed2024_nshards04.json \
              --task-ids N7 N8 N9 "${WRITE_FLAG[@]}"
          fi

      - name: "Apply expression/trajectory repairs to merged files (write mode only)"
        if: ${{ inputs.write == true }}
        run: |
          set -euo pipefail
          for f in \
            hypatiax/data/results/extrapolation/multi_seed/exp3_nguyen12_seed99_nshards01.json \
            hypatiax/data/results/extrapolation/multi_seed/exp3_nguyen12_seed123_nshards02.json \
            hypatiax/data/results/extrapolation/multi_seed/exp3_nguyen12_seed777_nshards03.json \
            hypatiax/data/results/extrapolation/multi_seed/exp3_nguyen12_seed2024_nshards04.json ; do
            echo "::group::Repairing $f"
            python3 AUDIT/fix_expression_trajectory_mismatch.py "$f" --in-place || true
            echo "::endgroup::"
          done

      - name: "Re-run trajectory checks to confirm 0 unresolved remain (write mode only)"
        if: ${{ inputs.write == true }}
        run: |
          set -euo pipefail
          FAIL=0
          for f in \
            hypatiax/data/results/extrapolation/multi_seed/exp3_nguyen12_seed99_nshards01.json \
            hypatiax/data/results/extrapolation/multi_seed/exp3_nguyen12_seed123_nshards02.json \
            hypatiax/data/results/extrapolation/multi_seed/exp3_nguyen12_seed777_nshards03.json \
            hypatiax/data/results/extrapolation/multi_seed/exp3_nguyen12_seed2024_nshards04.json ; do
            echo "::group::$f"
            python3 AUDIT/fix_expression_trajectory_mismatch.py "$f" || FAIL=1
            echo "::endgroup::"
          done
          if [[ "$FAIL" -eq 1 ]]; then
            echo "::error::Unresolved mismatches remain after merge -- the rerun did not fully fix them."
            exit 1
          fi

      # ── Persist results directly to the repo, mirroring the pattern
      # ── already used in _fixn3_temp_cell.yml for this exact situation.
      - name: "Commit and push merged results to repo"
        if: ${{ always() && inputs.write == true }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f hypatiax/data/results/extrapolation/multi_seed/
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "ci: nguyen12 targeted rerun -- merge unresolved records (run ${{ github.run_id }})"
          MAX_ATTEMPTS=5
          ATTEMPT=1
          until git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; do
            if [[ "${ATTEMPT}" -ge "${MAX_ATTEMPTS}" ]]; then
              echo "::error::Failed to push after ${MAX_ATTEMPTS} attempts. Results are in the uploaded artifact but not committed."
              exit 1
            fi
            ATTEMPT=$((ATTEMPT + 1))
            sleep $((RANDOM % 15 + 5))
          done

      - name: "Upload merged outputs as artifacts"
        if: always()
        uses: actions/upload-artifact@v4.3.6
        with:
          name: nguyen12-merged-${{ github.run_id }}
          path: |
            scratch/
            hypatiax/data/results/extrapolation/multi_seed/
          retention-days: 30

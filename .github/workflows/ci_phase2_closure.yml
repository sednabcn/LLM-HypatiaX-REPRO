name: Phase 2 closure (Pure LLM vs HDS)

# Single job, no shards, no workers. Runs ./run_all.sh phase2_closure on the COMMITTED
# Phase 2 rows. Needs no API key and no Julia. Independent of ci_runner_repro.yml.
on:
  workflow_dispatch:
    inputs:
      pure_llm_glob:
        description: "Committed Pure LLM rows (raw, as the runner wrote them)"
        required: false
        default: "archive/phase2/p2/pure_llm_*.jsonl"
      hds_glob:
        description: "Committed HDS rows"
        required: false
        default: "archive/phase2/p2/hds_*.jsonl"

permissions:
  contents: read

concurrency:
  group: phase2-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closure:
    name: Phase 2 closure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      P2_PURE_LLM_GLOB: ${{ github.event.inputs.pure_llm_glob }}
      P2_HDS_GLOB:      ${{ github.event.inputs.hds_glob }}
      PHASE2_CLOSURE_OUT: ${{ github.workspace }}/phase2_closure_out
      RESULTS_DIR:      ${{ github.workspace }}/hypatiax/data/results
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the evaluator check runs `git show <commit>:<file>` for the commit HDS recorded

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install closure dependencies
        run: python -m pip install --quiet numpy scipy pandas

      - name: Required inputs are committed
        run: |
          set -euo pipefail
          for f in scripts/phase2_close.py scripts/check_closure_nonfinite.py scripts/run_phase2_closure.sh hypatiax/core/r2_canonical.py; do
            [[ -f "$f" ]] || { echo "::error::missing $f"; exit 1; }
          done
          compgen -G "${P2_PURE_LLM_GLOB}" >/dev/null || { echo "::error::no Pure LLM rows match ${P2_PURE_LLM_GLOB}"; exit 1; }
          compgen -G "${P2_HDS_GLOB}"      >/dev/null || { echo "::error::no HDS rows match ${P2_HDS_GLOB}"; exit 1; }
          echo "Pure LLM files: $(compgen -G "${P2_PURE_LLM_GLOB}" | wc -l)  HDS files: $(compgen -G "${P2_HDS_GLOB}" | wc -l)"

      - name: Run phase2_closure
        run: |
          set -euo pipefail
          mkdir -p "${RESULTS_DIR}"
          bash run_all.sh phase2_closure

      - name: Summary
        if: always()
        run: |
          {
            echo '### Phase 2 closure'
            echo '```'
            tail -40 "${RESULTS_DIR}/phase2_closure_run.log" 2>/dev/null || echo "(no log written)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload closure output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-closure
          path: |
            phase2_closure_out/
            hypatiax/data/results/phase2_closure_run.log
          if-no-files-found: warn

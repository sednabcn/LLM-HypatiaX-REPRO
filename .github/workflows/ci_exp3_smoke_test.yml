# ==============================================================================
#  ci_exp3_smoke_test.yml — standalone runner for exp3_trajectory_smoke_test.py
#
#  Purpose: run ONLY the trajectory-monitor smoke test (not the full exp3
#  benchmark, not the repro pipeline) inside the same environment the main
#  HypatiaX runner uses (Python 3.12 + Julia 1.11 + pinned PySR 2.0.0a1),
#  so a broken trajectory-instrumentation regression is caught in a couple
#  of minutes instead of at the tail end of a 6-hour exp3 shard.
#
#  What it checks, mirroring exp3_trajectory_smoke_test.py's own docstring:
#    1. PySR starts and completes.
#    2. The HOF monitor sees checkpoints (via the produced seed JSON).
#    3. Trajectory diagnostics are written (non-empty "trajectory" field on
#       every finite-R2 record — same gate logic as ci_runner_repro.yml's
#       "Verify exp3 trajectories are populated" step).
#    4. Raw PySR checkpoint files land under _pysr_trajectory_runs/, which
#       are archived as a build artifact for post-hoc inspection either way.
#
#  This workflow deliberately does NOT do sharding, matrices, consolidation,
#  or figure generation — it is a fast, single-job correctness check.
# ==============================================================================

name: "HypatiaX - exp3 trajectory smoke test"
run-name: "exp3 trajectory smoke test · ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      use_llm:
        description: "Enable the LLM warm-start branch (requires ANTHROPIC_API_KEY secret)"
        required: false
        type: boolean
        default: false
  push:
    paths:
      - "hypatiax/experiments/benchmarks/exp3_trajectory_smoke_test.py"
      - "hypatiax/experiments/benchmarks/exp3_nguyen12_hybrid50v_02.py"
  pull_request:
    paths:
      - "hypatiax/experiments/benchmarks/exp3_trajectory_smoke_test.py"
      - "hypatiax/experiments/benchmarks/exp3_nguyen12_hybrid50v_02.py"

env:
  OUT_BASE: "hypatiax/data/results"
  SCRIPT: "hypatiax/experiments/benchmarks/exp3_trajectory_smoke_test.py"
  # Same Julia signal-handling fix as the main runner (FIX-G10): without this,
  # a Julia-side segfault inside SymbolicRegression.jl is invisible to Python.
  PYTHON_JULIACALL_HANDLE_SIGNALS: "yes"
  JULIA_NUM_THREADS: "4"
  JULIA_EXCLUSIVE: "0"
  USE_LLM: "${{ github.event.inputs.use_llm == 'true' && '1' || '0' }}"

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      # exp3_nguyen12_hybrid50v_02.py (which the smoke test runs via runpy)
      # imports pysr/juliacall, so Julia is required even for this short run.
      - name: Set up Julia 1.11
        uses: julia-actions/setup-julia@v2.6.1
        with:
          version: "1.11"

      - name: Cache Julia depot
        uses: actions/cache@v4
        with:
          path: ~/.julia
          key: julia-depot-${{ runner.os }}-${{ hashFiles('**/Project.toml', '**/Manifest.toml') }}
          restore-keys: |
            julia-depot-${{ runner.os }}-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "pandas==2.2.3"
          # Pinned to the pre-release that adds PySRRegressor(guesses=...),
          # used by exp3's LLM warm-start comparison. See FIX-PYSR-GUESSES-VERSION
          # in ci_runner_repro.yml — an unpinned install silently resolves to a
          # stable release that lacks this kwarg and breaks the warm-start arm.
          pip install "pysr==2.0.0a1" \
            numpy scipy sympy \
            anthropic \
            scikit-learn \
            pyyaml \
            python-dotenv \
            matplotlib \
            seaborn \
            pmlb \
            pint \
            psutil

      - name: Install Julia / SymbolicRegression
        run: |
          python3 -c "import pysr; pysr.install()"

      # Warm the Julia depot before the timed smoke-test run so that PySR
      # startup/precompilation time doesn't eat into PYSR_TIMEOUT=45s.
      - name: Precompile Julia / SymbolicRegression
        run: |
          python3 - <<'PYEOF'
          import subprocess, sys
          warmup = """
          import numpy as np
          import pysr
          X = np.random.randn(20, 1)
          y = X[:, 0] * 2.0 + 1.0
          model = pysr.PySRRegressor(
              niterations=5,
              populations=1,
              verbosity=0,
              progress=False,
              tempdir="/tmp/pysr_warmup",
          )
          model.fit(X, y)
          print("Julia/PySR precompile warmup OK")
          """
          result = subprocess.run(
              [sys.executable, "-c", warmup],
              timeout=300,
              capture_output=True,
              text=True,
          )
          print(result.stdout or "")
          if result.returncode != 0:
              print("WARNING: Julia precompile warmup failed:")
              print(result.stderr[-3000:] if result.stderr else "(no stderr)")
          PYEOF

      - name: Verify Julia threads
        run: |
          julia -e 'println("Julia threads: ", Threads.nthreads())'

      - name: Environment check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "Python: $(python3 --version)"
          python3 -c "import pysr;    print('PySR:         ', pysr.__version__)"
          python3 -c "import torch;   print('PyTorch:      ', torch.__version__)"
          python3 -c "import sympy;   print('SymPy:        ', sympy.__version__)"
          python3 -c "import scipy;   print('SciPy:        ', scipy.__version__)"
          python3 -c "import sklearn; print('scikit-learn: ', sklearn.__version__)"
          if [[ "${USE_LLM}" == "1" ]]; then
            python3 -c "import anthropic; print('anthropic SDK: ok')"
            if [[ -z "${ANTHROPIC_API_KEY:-}" ]]; then
              echo "::error::use_llm=true but ANTHROPIC_API_KEY secret is empty/unset."
              exit 1
            fi
            echo "ANTHROPIC_API_KEY: set (${#ANTHROPIC_API_KEY} chars)"
          else
            echo "USE_LLM=0 — skipping ANTHROPIC_API_KEY requirement."
          fi
          echo "JULIA_NUM_THREADS: ${JULIA_NUM_THREADS}"

      - name: Create results directory structure
        run: |
          mkdir -p "${OUT_BASE}/extrapolation" "${{ github.workspace }}/logs"

      - name: Run exp3 trajectory smoke test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          echo "Running ${SCRIPT} ..."
          python3 "${SCRIPT}" 2>&1 | tee "${{ github.workspace }}/logs/exp3_smoke_test.log"

      # [Same gate as ci_runner_repro.yml's "Verify exp3 trajectories are
      # populated" step] A successful PySR fit must not silently produce an
      # empty trajectory. This turns that regression into an immediate,
      # actionable CI failure rather than a silent gap discovered later by
      # generate_figures.py.
      - name: Verify trajectory diagnostics were written
        env:
          TARGET: ${{ github.workspace }}/${{ env.OUT_BASE }}/extrapolation
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import glob, json, math, os, sys
          target = os.environ["TARGET"]
          files = sorted(glob.glob(os.path.join(target, "exp3_nguyen12_seed*.json")))
          if not files:
              print(f"::error::No exp3_nguyen12_seed*.json found under {target} — "
                    "the smoke test did not produce output.")
              sys.exit(1)
          bad = []
          checked = 0
          for path in files:
              try:
                  data = json.load(open(path, encoding="utf-8"))
              except Exception as e:
                  bad.append((os.path.basename(path), "invalid JSON", str(e)))
                  continue
              records = []
              if isinstance(data, dict):
                  container = data.get("results") if isinstance(data.get("results"), dict) else data
                  for key in ("hypatiax", "pysr", "results_hypatia", "results_pysr"):
                      value = container.get(key) if isinstance(container, dict) else None
                      if isinstance(value, list):
                          records.extend(value)
              for rec in records:
                  if not isinstance(rec, dict):
                      continue
                  checked += 1
                  r2 = ((rec.get("evaluation") or {}).get("r2"))
                  traj = rec.get("trajectory")
                  try:
                      finite_r2 = math.isfinite(float(r2))
                  except Exception:
                      finite_r2 = False
                  if finite_r2 and not traj:
                      bad.append((os.path.basename(path), rec.get("system"),
                                  rec.get("expression"), rec.get("trajectory_summary")))
          print(f"Checked {checked} fitted result record(s) across {len(files)} seed file(s).")
          if bad:
              print("::error::Successful exp3 PySR result(s) have empty trajectories:")
              for row in bad:
                  print("  ", row)
              print("Inspect hof_path/hof_exists_at_end in the fit diagnostics and "
                    "the _pysr_trajectory_runs/ artifact uploaded by this run.")
              sys.exit(1)
          print("OK: every finite-R2 record has a non-empty trajectory.")
          PYEOF

      - name: Upload PySR trajectory checkpoint files
        if: always()
        uses: actions/upload-artifact@v4.3.6
        with:
          name: exp3-smoke-test-trajectory-runs
          path: ${{ env.OUT_BASE }}/_pysr_trajectory_runs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload smoke test results and log
        if: always()
        uses: actions/upload-artifact@v4.3.6
        with:
          name: exp3-smoke-test-results
          path: |
            ${{ env.OUT_BASE }}/extrapolation/
            logs/exp3_smoke_test.log
          if-no-files-found: warn
          retention-days: 14

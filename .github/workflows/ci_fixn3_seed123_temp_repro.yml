# ==============================================================================
#  ci_fixn3_seed123_temp_repro.yml - FIX-N3 item (ii) determinism/temperature
#                                     experiment (standalone runner)
#
#  Companion to ci_runner_repro.yml and ci_issue2b_repro.yml, reusing their
#  established conventions (Python 3.12 / Julia 1.11 setup, ANTHROPIC_API_KEY
#  live-validation, results-dir layout, commit-and-push pattern), but scoped
#  to a single, narrow question left open in jmlr_paper_main_patched.tex's
#  "Reproducibility note: LLM model identity and a seed-123 discrepancy
#  (extends issue FIX-N3)" paragraph, action item (ii):
#
#    "a future re-benchmarked seed-123 run should record hypatia.py's
#     sampling temperature and candidate count alongside the solve-rate
#     fields, and report a distribution over repeated runs rather than a
#     single value"
#
#  Items (i) and (iii) of that same list are already resolved (dead
#  LLM_MODEL env var wired up; run_all.sh obtained and confirms exp3 /
#  exp3b are the scripts CI actually invokes for Nguyen-12) — see the tex
#  file's reproducibility note for the resolved-item citations. This
#  workflow exists solely to close item (ii).
#
#  Design: exactly 4 explicit jobs, one per (experiment × temperature)
#  cell, rather than a GitHub Actions `matrix:` block. This is deliberate:
#  each cell's results land in its own clearly-named artifact and its own
#  results subdirectory, so a reviewer can open e.g. "exp3-seed123-temp0"
#  directly instead of decoding a matrix run's generated job name. The
#  four jobs are fully independent and run in parallel.
#
#  PARALLELIZATION IMPROVEMENT: Within each cell, the n_runs repeats are
#  now parallelized via matrix strategy instead of sequential loop. This
#  reduces wall time from 5 × 60 min = 300 min per cell to ~60 min per cell
#  (all 5 runs execute concurrently). Four cells still run in parallel,
#  so total wall time is ~60 min instead of 1200 min for n_runs=5.
#
#    Job 1: exp3_seed123_temp025  — protocol match (original solve-rate
#            was measured at hypatia.py's default temperature=0.25).
#            Gives the "distribution over repeated runs" item (ii) asks
#            for, at the temperature the original 11/12-vs-12/12
#            discrepancy was actually observed at.
#    Job 2: exp3_seed123_temp0    — determinism control. If solve-count
#            still varies run-to-run at temperature=0, that points away
#            from LLM sampling noise as the explanation and toward the
#            flagged-but-unconfirmed late-April/late-May 2026
#            infrastructure migration instead.
#    Job 3: exp3b_seed123_temp025 — same protocol-match run for exp3b.
#    Job 4: exp3b_seed123_temp0   — same determinism control for exp3b.
#
#  exp3 vs. exp3b: NOT two different scripts. run_all.sh's exp3 step runs
#  exp3_nguyen12_hybrid50v_03.py at seed 42 (the primary result); exp3b is
#  the same script run across the other stability-check seeds (99, 123,
#  777, 2024 — see the script's own docstring). Seed 123, used throughout
#  this workflow, is in that non-42 set, so jobs 1-4 all invoke the exact
#  same script_path; "exp3"/"exp3b" here are cell labels for
#  artifact/results-dir organization, matching how the two are reported
#  as separate rows/steps elsewhere in the pipeline, not a code branch.
#
#  Each script invocation uses hypatia.py's get_llm_prior() call path
#  directly (not run_all.sh --step exp3), so there is no PySR-only /
#  --skip-pysr fast path available here the way ci_issue2b_repro.yml has
#  one: exp3/exp3b are the full 12-equation x (LLM-prior + PySR-only)
#  suite, so every repeat pays the full ~30-90 min wall time noted in
#  exp3_nguyen12_hybrid50v_03.py's docstring. Keep n_runs modest.
# ==============================================================================

name: "HypatiaX - FIX-N3 item (ii): seed-123 temperature experiment"
run-name: "FIX-N3 item (ii) · seed ${{ inputs.seed }} · n_runs=${{ inputs.n_runs }}${{ inputs.skip_exp3b == 'true' && ' · exp3 only' || ' · exp3+exp3b' }}"

on:
  workflow_dispatch:
    inputs:

      script_path:
        description: "Path (relative to repo root) to the exp3/exp3b script (same script for both — see header note; run_all.sh's exp3 step uses seed 42, exp3b uses the other stability-check seeds)"
        required: false
        default: "hypatiax/experiments/benchmarks/exp3_nguyen12_hybrid50v_03.py"

      seed:
        description: "Seed to repeat-run (item (ii) is specifically about seed 123's discrepancy)"
        required: false
        default: "123"

      n_runs:
        description: "Number of repeated runs per (experiment, temperature) cell — becomes the distribution item (ii) asks for. Parallelized via strategy.matrix, so wall time is ~1 run duration (~30-90 min) regardless of n_runs, not n_runs x that."
        required: false
        default: "5"

      candidate_count:
        description: "[FIX-N3-ii] hypatia.py's get_llm_prior() candidate-sampling width — how many LLM-proposed candidate expressions are drawn per equation before trust-gating. Item (ii) requires this recorded alongside temperature/solve-rate. Passed to the script as --n-candidates; requires the script to expose that flag."
        required: false
        default: "5"

      skip_exp3b:
        description: "Skip jobs 3/4 (exp3b-labeled cells). DEFAULT TRUE: exp3 and exp3b invoke the exact same script with the exact same --seed/--temperature/--run-index args (see header note), so running both for a single seed is pure duplicate compute — same API cost twice, and the resulting JSON files are indistinguishable by content, which previously caused the summarize job to silently double-count rows. Set to 'false' only if you deliberately want two independent samples per (temp, run_index) cell for a robustness check, and note the summary table now separates them by experiment_label so they won't be conflated."
        required: false
        type: choice
        options: ["true", "false"]
        default: "true"

      dry_run:
        description: "Print the planned commands and stop, no benchmark runs (true/false)"
        required: false
        type: choice
        options: ["false", "true"]
        default: "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions:  write

env:
  # Matches repro.yaml paper-quality values, same names as
  # ci_runner_repro.yml / exp3_nguyen12_hybrid50v_03.py's own env reads.
  N_ITERATIONS:       "1000"
  POPULATIONS:        "30"
  PYSR_TIMEOUT:        "1100"  # repro.yaml timeouts.feynman_pysr_seconds
  METHOD_TIMEOUT:      "1100"  # repro.yaml timeouts.method_seconds
  PYTHON_JULIACALL_HANDLE_SIGNALS: "yes"
  OUT_BASE:            "hypatiax/data/results/fixn3_item_ii"

jobs:

  # ── Compute the run-index matrix ([1..n_runs]) once, so every cell job
  # ── below can expand strategy.matrix over it. GitHub Actions matrix
  # ── values must come from a real JSON array (fromJson), and n_runs is a
  # ── dynamic workflow_dispatch string input, so it can't be inlined as a
  # ── matrix range directly — this tiny job is what makes the reusable
  # ── workflow's single-run-per-job / caller-expands-the-matrix design
  # ── (see _fixn3_temp_cell.yml's header) actually work end to end.
  setup:
    name: "Compute run-index matrix"
    runs-on: ubuntu-latest
    outputs:
      run_indices: ${{ steps.gen.outputs.run_indices }}
    steps:
      - id: gen
        run: |
          python3 -c "import json; print('run_indices=' + json.dumps(list(range(1, int('${{ inputs.n_runs }}') + 1))))" >> "$GITHUB_OUTPUT"

  # ── Job 1: exp3, temperature=0.25 (protocol match) ─────────────────────
  exp3_seed123_temp025:
    name: "exp3 · seed 123 · temp=0.25"
    needs: setup
    uses: ./.github/workflows/_fixn3_temp_cell.yml
    strategy:
      fail-fast: false
      matrix:
        run_index: ${{ fromJson(needs.setup.outputs.run_indices) }}
    with:
      script_path: ${{ inputs.script_path }}
      experiment_label: "exp3"
      temperature: "0.25"
      seed: ${{ inputs.seed }}
      n_runs: ${{ inputs.n_runs }}
      candidate_count: ${{ inputs.candidate_count }}
      run_index: ${{ matrix.run_index }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit

  # ── Job 2: exp3, temperature=0 (determinism control) ───────────────────
  exp3_seed123_temp0:
    name: "exp3 · seed 123 · temp=0"
    needs: setup
    uses: ./.github/workflows/_fixn3_temp_cell.yml
    strategy:
      fail-fast: false
      matrix:
        run_index: ${{ fromJson(needs.setup.outputs.run_indices) }}
    with:
      script_path: ${{ inputs.script_path }}
      experiment_label: "exp3"
      temperature: "0"
      seed: ${{ inputs.seed }}
      n_runs: ${{ inputs.n_runs }}
      candidate_count: ${{ inputs.candidate_count }}
      run_index: ${{ matrix.run_index }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit

  # ── Job 3: exp3b, temperature=0.25 (protocol match) ─────────────────────
  exp3b_seed123_temp025:
    name: "exp3b · seed 123 · temp=0.25"
    needs: setup
    uses: ./.github/workflows/_fixn3_temp_cell.yml
    if: ${{ inputs.skip_exp3b != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        run_index: ${{ fromJson(needs.setup.outputs.run_indices) }}
    with:
      script_path: ${{ inputs.script_path }}
      experiment_label: "exp3b"
      temperature: "0.25"
      seed: ${{ inputs.seed }}
      n_runs: ${{ inputs.n_runs }}
      candidate_count: ${{ inputs.candidate_count }}
      run_index: ${{ matrix.run_index }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit

  # ── Job 4: exp3b, temperature=0 (determinism control) ──────────────────
  exp3b_seed123_temp0:
    name: "exp3b · seed 123 · temp=0"
    needs: setup
    uses: ./.github/workflows/_fixn3_temp_cell.yml
    if: ${{ inputs.skip_exp3b != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        run_index: ${{ fromJson(needs.setup.outputs.run_indices) }}
    with:
      script_path: ${{ inputs.script_path }}
      experiment_label: "exp3b"
      temperature: "0"
      seed: ${{ inputs.seed }}
      n_runs: ${{ inputs.n_runs }}
      candidate_count: ${{ inputs.candidate_count }}
      run_index: ${{ matrix.run_index }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit

  # ── Aggregation: pull h_rate/n_h_copy_of_p across all four cells' repeat
  # ── runs into one summary table, so item (ii)'s "distribution over
  # ── repeated runs" is readable from the job summary without opening
  # ── four separate artifact bundles by hand. Non-blocking (continue-on-
  # ── error): a summary formatting bug must never fail a build whose
  # ── underlying benchmark runs all succeeded.
  summarize:
    name: "Summarize solve-rate distribution across cells"
    needs: [exp3_seed123_temp025, exp3_seed123_temp0, exp3b_seed123_temp025, exp3b_seed123_temp0]
    if: ${{ always() && inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: Download all cell artifacts
        uses: actions/download-artifact@v4.1.8
        with:
          pattern: fixn3-item-ii-*-${{ github.run_id }}
          path: ${{ env.OUT_BASE }}/downloaded
          merge-multiple: false

      - name: Debug - List downloaded artifacts
        run: |
          echo "=== Downloaded Artifacts Structure ==="
          find "${{ env.OUT_BASE }}/downloaded" -type f -name "*.json" | head -20
          echo ""
          echo "=== Total JSON files found ==="
          find "${{ env.OUT_BASE }}/downloaded" -type f -name "*.json" | wc -l

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Build distribution summary
        run: |
          python3 - << 'PYEOF'
          import glob, json, re, statistics, pathlib, hashlib

          # Artifact folders are named "fixn3-item-ii-<label>-seed<seed>-temp<temp>-run<run>-<run_id>"
          # by _fixn3_temp_cell.yml's upload-artifact step. Since exp3/exp3b invoke the identical
          # script with identical args (see workflow header), the JSON *content* alone cannot tell
          # a cell apart from its twin — the label must be read from the artifact folder name, not
          # from the JSON's own "config" block (which has no notion of exp3 vs exp3b).
          ARTIFACT_RE = re.compile(r"^fixn3-item-ii-(?P<label>.+?)-seed")

          rows = []
          seen_hashes = {}  # (temperature, run_index) -> {content_hash: [labels]}
          json_files = sorted(glob.glob("${{ env.OUT_BASE }}/downloaded/**/*.json", recursive=True))
          print(f"Found {len(json_files)} JSON files to process")

          for path in json_files:
              p = pathlib.Path(path)
              if p.name.startswith("_"):
                  print(f"  Skipping checkpoint: {p.name}")
                  continue  # skip partial/checkpoint files

              # Recover the experiment_label from the enclosing artifact folder name.
              label = "unknown"
              for part in p.parts:
                  m = ARTIFACT_RE.match(part)
                  if m:
                      label = m.group("label")
                      break

              try:
                  raw = p.read_text()
                  data = json.loads(raw)
              except Exception as e:
                  print(f"  ERROR reading {p.name}: {e}")
                  continue
              cfg, summ = data.get("config", {}), data.get("summary", {})
              if "h_rate" not in summ:
                  print(f"  SKIP (no h_rate): {p.name}")
                  continue

              temp, run_idx = cfg.get("temperature"), cfg.get("run_index")
              content_hash = hashlib.sha256(raw.encode()).hexdigest()
              key = (temp, run_idx)
              seen_hashes.setdefault(key, {}).setdefault(content_hash, []).append(label)

              rows.append({
                  "file": p.name,
                  "experiment_label": label,
                  "seed": cfg.get("seed"),
                  "temperature": temp,
                  "candidate_count": cfg.get("n_candidates", cfg.get("candidate_count")),
                  "run_index": run_idx,
                  "h_rate": summ.get("h_rate"),
                  "h_recovered": summ.get("h_recovered"),
                  "n_total": summ.get("n_total"),
              })
              print(f"  ✓ [{label}] {p.name}")

          print("\n### FIX-N3 item (ii) — solve-rate distribution\n")
          print(f"Collected {len(rows)} completed run file(s).\n")

          if not rows:
              print("⚠  WARNING: No rows collected. Check that JSON files contain 'h_rate' in summary.")
              exit(1)

          missing_cc = [r["file"] for r in rows if r["candidate_count"] is None]
          if missing_cc:
              print(f"⚠  WARNING: {len(missing_cc)} row(s) have no candidate_count — the script's output JSON "
                    f"config block doesn't record it (item (ii) requires this). Affected: {missing_cc[:5]}"
                    f"{'...' if len(missing_cc) > 5 else ''}")

          # Flag cells that are byte-identical across labels at the same (temperature, run_index) —
          # this is exactly the exp3/exp3b duplicate-compute pattern that previously doubled the
          # apparent sample size. Never silently fold these into one distribution.
          dup_warnings = []
          for (temp, run_idx), hashes in seen_hashes.items():
              for h, labels in hashes.items():
                  if len(labels) > 1:
                      dup_warnings.append((temp, run_idx, labels))
          if dup_warnings:
              print("⚠  DUPLICATE-CONTENT WARNING: identical JSON produced by multiple labels for the same (temperature, run_index):")
              for temp, run_idx, labels in dup_warnings:
                  print(f"   temp={temp} run_index={run_idx} labels={labels} — these are the same underlying run, not independent samples.")

          # Group by (experiment_label, temperature) — NOT temperature alone — so duplicate-compute
          # cells (e.g. exp3 vs exp3b re-running the identical args) can never be silently merged
          # into a single, inflated distribution.
          by_group = {}
          for r in rows:
              by_group.setdefault((r["experiment_label"], r["temperature"]), []).append(r["h_recovered"])

          print("| experiment_label | temperature | candidate_count(s) | n_runs | h_recovered values | mean | stdev |")
          print("|---|---|---|---|---|---|---|")
          for (label, temp), vals in sorted(by_group.items(), key=lambda kv: (str(kv[0][0]), str(kv[0][1]))):
              mean = statistics.mean(vals) if vals else float("nan")
              stdev = statistics.pstdev(vals) if len(vals) > 1 else 0.0
              cc_vals = sorted({r["candidate_count"] for r in rows if r["experiment_label"] == label and r["temperature"] == temp}, key=str)
              print(f"| {label} | {temp} | {cc_vals} | {len(vals)} | {vals} | {mean:.3f} | {stdev:.3f} |")

          summary_path = pathlib.Path("${{ env.OUT_BASE }}/item_ii_distribution_summary.json")
          summary_path.parent.mkdir(parents=True, exist_ok=True)
          summary_path.write_text(json.dumps({
              "rows": rows,
              "duplicate_content_warnings": [
                  {"temperature": t, "run_index": ri, "labels": ls} for t, ri, ls in dup_warnings
              ],
          }, indent=2))
          print(f"\n✓ Summary written to: {summary_path}")
          PYEOF

      - name: Write to job summary
        run: |
          echo "## FIX-N3 item (ii) — Solve-Rate Distribution Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "See step log above for the per-(label, temperature) distribution table." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Raw per-run rows: \`${OUT_BASE}/item_ii_distribution_summary.json\` (uploaded below)." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload distribution summary
        if: always()
        uses: actions/upload-artifact@v4.3.6
        with:
          name: fixn3-item-ii-distribution-summary-${{ github.run_id }}
          path: ${{ env.OUT_BASE }}/item_ii_distribution_summary.json
          if-no-files-found: warn
          retention-days: 30

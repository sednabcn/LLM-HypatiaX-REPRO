name: PR merge continuation signal

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to inspect
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: pr-merge-continuation-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  report-pr-state:
    runs-on: ubuntu-latest
    steps:
      - name: Detect merge and publish continuation signal
        uses: actions/github-script@v7
        with:
          script: |
            let prs;
            if (context.eventName === "workflow_dispatch") {
              const number = Number(context.payload.inputs.pr_number);
              if (!Number.isInteger(number) || number < 1) {
                core.setFailed("A valid pull request number is required.");
                return;
              }
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner, repo: context.repo.repo, pull_number: number
              });
              prs = [pr];
            } else if (context.eventName === "pull_request") {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner, repo: context.repo.repo,
                pull_number: context.payload.pull_request.number
              });
              prs = [pr];
            } else {
              const { data } = await github.rest.pulls.list({
                owner: context.repo.owner, repo: context.repo.repo,
                state: "closed", sort: "updated", direction: "desc", per_page: 100
              });
              const cutoff = Date.now() - 24 * 60 * 60 * 1000;
              prs = data.filter(pr => new Date(pr.updated_at).getTime() >= cutoff);
            }

            for (const pr of prs) {
              const marker = "<!-- hypatiax-pr-continuation-signal -->";
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: pr.number, per_page: 100
              });
              const prior = comments.find(comment => comment.body && comment.body.includes(marker));
              const state = pr.merged ? "MERGED" : pr.state === "closed" ? "CLOSED_NOT_MERGED" : "OPEN";
              const body = [
                marker,
                "## HypatiaX PR continuation signal",
                "",
                `**Detected state:** ${state}`,
                `**PR:** #${pr.number} — ${pr.title}`,
                `**Head:** ${pr.head.sha}`,
                pr.merged ? `**Merge commit:** ${pr.merge_commit_sha || "not supplied by GitHub"}` : "**Merge commit:** not applicable",
                "",
                pr.merged
                  ? "Merged. On the next assistant session, verify merge-commit checks and resume the next safe repository task. Do not launch experiments, paid provider calls, calibration, or seed sweeps without explicit approval."
                  : "Not merged. Do not treat this PR as completed.",
                "",
                "Durable GitHub signal only; this does not wake an external ChatGPT conversation."
              ].join("\n");
              if (prior) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  comment_id: prior.id, body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: pr.number, body
                });
              }
              core.notice(`PR #${pr.number}: ${state}`);
            }

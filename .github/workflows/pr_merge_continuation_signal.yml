name: PR merge continuation signal

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to inspect
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-merge-continuation-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  report-pr-state:
    runs-on: ubuntu-latest
    steps:
      - name: Detect merge and publish continuation signal
        uses: actions/github-script@v7
        with:
          script: |
            let prs;
            if (context.eventName === "workflow_dispatch") {
              const number = Number(context.payload.inputs.pr_number);
              if (!Number.isInteger(number) || number < 1) {
                core.setFailed("A valid pull request number is required.");
                return;
              }
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner, repo: context.repo.repo, pull_number: number
              });
              prs = [pr];
            } else if (context.eventName === "pull_request") {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner, repo: context.repo.repo,
                pull_number: context.payload.pull_request.number
              });
              prs = [pr];
            } else {
              const { data } = await github.rest.pulls.list({
                owner: context.repo.owner, repo: context.repo.repo,
                state: "closed", sort: "updated", direction: "desc", per_page: 100
              });
              const cutoff = Date.now() - 24 * 60 * 60 * 1000;
              prs = data.filter(pr => new Date(pr.updated_at).getTime() >= cutoff);
            }

            await core.summary
              .addHeading("HypatiaX PR continuation signals")
              .addRaw("This run records PR state in the Actions run summary. It does not attempt to write PR comments or wake an external ChatGPT session.")
              .addEOL();

            for (const pr of prs) {
              const state = pr.merged ? "MERGED" : pr.state === "closed" ? "CLOSED_NOT_MERGED" : "OPEN";
              core.summary
                .addHeading(`PR #${pr.number}: ${state}`, 2)
                .addTable([
                  [{data:"Field",header:true},{data:"Value",header:true}],
                  ["Title", pr.title],
                  ["Head SHA", pr.head.sha],
                  ["Base SHA", pr.base.sha],
                  ["Merge commit", pr.merge_commit_sha || "not applicable"]
                ])
                .addEOL();
              core.notice(`PR #${pr.number}: ${state}; head=${pr.head.sha}; merge=${pr.merge_commit_sha || "none"}`);
            }

            if (prs.length === 0) {
              core.summary.addRaw("No recently updated closed PRs found in the reconciliation window.").addEOL();
            }
            await core.summary.write();

# ==============================================================================
#  ci_smoke_test_v4.yml - fast wiring check for the v4 / v4_pca / consolidated
#                          exp3 scripts, on a tiny 1-2 case slice.
#
#  This is deliberately NOT part of ci_runner_repro.yml's sharded plan/worker
#  architecture. It exists to answer one question quickly (a few minutes, not
#  hours): "do hypatiax_defi_benchmark_v4.py, hypatiax_defi_benchmark_v4_pca.py,
#  and exp3_nguyen12_consolidated.py still run end-to-end and produce a result
#  JSON?" Use ci_runner_repro.yml for the full paper-quality reproduction runs.
#
#  Script CLI surface (asserted at runtime, not assumed):
#    - hypatiax_defi_benchmark_v4.py     : --output-dir, --cases SUBSTRING [...],
#                                          DEFI_SEEDS (env), no --seeds flag.
#    - hypatiax_defi_benchmark_v4_pca.py : --output-dir, --cases, --force-fresh,
#                                          --seeds SEED [...]. Writes its own
#                                          split_protocol_disclosure.json.
#    - exp3_nguyen12_consolidated.py     : --seed, --temperature, --run-index,
#                                          --n-candidates. Per-equation filter
#                                          via TASK_IDS / SHARD_IDS env var (see
#                                          _apply_task_ids_nguyen); 0-match is a
#                                          hard exit (FIX-1). Output path honours
#                                          RESULTS_DIR (env).
#
#  HARDENING NOTES (why this file looks paranoid):
#    1. Every `run:` block sets `shell: bash` and `set -o pipefail`. Without it,
#       `python3 ... | tee run.log` reports tee's exit status, so a script that
#       dies on argparse / import / API-auth errors looks like a clean run and
#       only surfaces later as a misleading "produced no result JSON".
#    2. --output-dir and --cases are PROBED via --help before use, and a missing
#       flag is a hard failure. Previously --cases fell back to running the FULL
#       catalogue, which blows the job timeout; and --output-dir was asserted
#       blind, so a renamed/ignored flag silently dumped results into the
#       script's own default directory.
#    3. A sentinel file timestamps the start of each script run, so the JSON
#       count only sees files that THIS run produced - stale files from a cache
#       or a previous step cannot create a false pass.
#    4. A "Locate stray result JSON" step lists every JSON written anywhere in
#       the workspace, so "results didn't save" is diagnosable in one run: files
#       under OUT_BASE instead of SMOKE_DIR == --output-dir is being ignored.
#    5. Workflow inputs are passed through `env:` rather than interpolated into
#       the shell with ${{ }}. Direct interpolation lets a crafted input string
#       execute arbitrary commands in the runner.
# ==============================================================================

name: "HypatiaX - smoke test (v4 / v4_pca / exp3 consolidated)"
run-name: "Smoke test v4 · ${{ inputs.defi_case_1 }} / ${{ inputs.defi_case_2 }} · ${{ inputs.nguyen_task_1 }} / ${{ inputs.nguyen_task_2 }}"

on:
  workflow_dispatch:
    inputs:
      defi_case_1:
        description: "First DeFi case name substring to test (hypatiax_defi_benchmark_v4.py --cases)"
        required: false
        default: "Portfolio Sharpe Ratio"
      defi_case_2:
        description: "Second DeFi case name substring to test (leave blank to test only one case)"
        required: false
        default: "Correlated Portfolio VaR"
      nguyen_seed:
        description: "Seed to smoke-test exp3_nguyen12_consolidated.py with"
        required: false
        default: "42"
      nguyen_task_1:
        description: "First Nguyen equation ID to test (exp3_nguyen12_consolidated.py TASK_IDS)"
        required: false
        default: "N1"
      nguyen_task_2:
        description: "Second Nguyen equation ID to test (leave blank to test only one)"
        required: false
        default: "N3"
      temperature:
        description: "LLM temperature passed to exp3_nguyen12_consolidated.py"
        required: false
        default: "0.25"
  pull_request:
    paths:
      - "hypatiax/experiments/benchmarks/hypatiax_defi_benchmark_v4.py"
      - "hypatiax/experiments/benchmarks/hypatiax_defi_benchmark_v4_pca.py"
      - "hypatiax/experiments/benchmarks/exp3_nguyen12_consolidated.py"
      - "run_all.sh"

concurrency:
  group: ci-smoke-test-v4-${{ github.ref }}
  # NOTE: deliberately false. With cancel-in-progress:true, a second push kills
  # the first job before its `if: always()` upload step runs, which presents
  # as "the artifacts vanished" and is easy to misdiagnose as a script bug.
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  OUT_BASE: "hypatiax/data/results"
  SMOKE_DIR: "hypatiax/data/results/_smoke_test_v4"
  # Small, fast hyperparameters - this job is a correctness/wiring check,
  # not a paper-quality run. Do not compare these numbers to the paper.
  PYSR_GENERATIONS: "200"
  PYSR_POPULATIONS: "4"
  METHOD_TIMEOUT: "120"
  PYSR_FIT_WALL_TIMEOUT: "150"
  PYSR_FIT_GRACE_SECS: "30"
  PYTHON_JULIACALL_HANDLE_SIGNALS: "yes"
  JULIA_NUM_THREADS: "2"
  JULIA_EXCLUSIVE: "0"

jobs:
  smoke_test:
    name: "Smoke test: v4 / v4_pca / exp3 consolidated"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Set up Julia 1.11
        uses: julia-actions/setup-julia@v2.6.1
        with:
          version: "1.11"

      - name: Cache Julia depot
        uses: actions/cache@v4
        with:
          path: ~/.julia
          key: julia-depot-${{ runner.os }}-${{ hashFiles('**/Project.toml', '**/Manifest.toml') }}
          restore-keys: |
            julia-depot-${{ runner.os }}-

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "pandas==2.2.3"
          pip install "pysr==2.0.0a1" \
            numpy scipy sympy \
            anthropic \
            scikit-learn \
            pyyaml \
            python-dotenv \
            matplotlib \
            seaborn \
            pmlb \
            pint \
            psutil
          python3 -c "import pysr; pysr.install()"

      - name: Create scratch results directory
        run: |
          set -euo pipefail
          mkdir -p "${SMOKE_DIR}/defi_v4" "${SMOKE_DIR}/defi_v4_pca" "${SMOKE_DIR}/exp3"

      - name: Validate ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${ANTHROPIC_API_KEY:-}" ]] || { echo "::error::ANTHROPIC_API_KEY secret is empty or unset."; exit 1; }
          echo "ANTHROPIC_API_KEY: set (${#ANTHROPIC_API_KEY} chars)"

      # ── v4: 1-2 named DeFi cases ────────────────────────────────────────────
      - name: "Smoke test: hypatiax_defi_benchmark_v4.py"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEFI_SEEDS: "${{ inputs.nguyen_seed || '42' }}"
          DEFI_CASE_1: "${{ inputs.defi_case_1 || 'Portfolio Sharpe Ratio' }}"
          DEFI_CASE_2: "${{ inputs.defi_case_2 }}"
        run: |
          set -euo pipefail

          SCRIPT="hypatiax/experiments/benchmarks/hypatiax_defi_benchmark_v4.py"
          OUTDIR="${SMOKE_DIR}/defi_v4"
          [[ -f "${SCRIPT}" ]] || { echo "::error::${SCRIPT} not found"; exit 1; }

          # Probe the CLI surface. A --help that fails at all means the script
          # cannot even import; running it would just waste the job timeout.
          if ! HELP="$(python3 "${SCRIPT}" --help 2>&1)"; then
            echo "::error::${SCRIPT} --help failed (import-time error?). Output follows:"
            echo "${HELP}"
            exit 1
          fi
          grep -q -- '--output-dir' <<<"${HELP}" \
            || { echo "::error::${SCRIPT} has no --output-dir flag; results would land outside ${OUTDIR}"; exit 1; }
          grep -q -- '--cases' <<<"${HELP}" \
            || { echo "::error::${SCRIPT} has no --cases flag; refusing to run the full catalogue in a smoke test"; exit 1; }

          CASE_ARGS=("${DEFI_CASE_1}")
          [[ -n "${DEFI_CASE_2}" ]] && CASE_ARGS+=("${DEFI_CASE_2}")
          echo "[v4] --cases filter: ${CASE_ARGS[*]}"

          # Sentinel: only JSON newer than this counts as produced by THIS run.
          touch "${RUNNER_TEMP}/v4.stamp"

          python3 "${SCRIPT}" \
            --output-dir "${OUTDIR}" \
            --cases "${CASE_ARGS[@]}" \
            2>&1 | tee "${OUTDIR}/run.log"

          COUNT=$(find "${OUTDIR}" -name '*.json' -newer "${RUNNER_TEMP}/v4.stamp" 2>/dev/null | wc -l)
          echo "v4 result JSON files (this run): ${COUNT}"
          [[ "${COUNT}" -gt 0 ]] || { echo "::error::hypatiax_defi_benchmark_v4.py produced no result JSON in ${OUTDIR}"; exit 1; }

      # ── v4_pca: same 1-2 named DeFi cases, PCA 40/60 split ──────────────────
      - name: "Smoke test: hypatiax_defi_benchmark_v4_pca.py"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEFI_CASE_1: "${{ inputs.defi_case_1 || 'Portfolio Sharpe Ratio' }}"
          DEFI_CASE_2: "${{ inputs.defi_case_2 }}"
        run: |
          set -euo pipefail

          SCRIPT="hypatiax/experiments/benchmarks/hypatiax_defi_benchmark_v4_pca.py"
          OUTDIR="${SMOKE_DIR}/defi_v4_pca"
          [[ -f "${SCRIPT}" ]] || { echo "::error::${SCRIPT} not found"; exit 1; }

          if ! HELP="$(python3 "${SCRIPT}" --help 2>&1)"; then
            echo "::error::${SCRIPT} --help failed (import-time error?). Output follows:"
            echo "${HELP}"
            exit 1
          fi
          for FLAG in --output-dir --cases --force-fresh; do
            grep -q -- "${FLAG}" <<<"${HELP}" \
              || { echo "::error::${SCRIPT} has no ${FLAG} flag"; exit 1; }
          done

          CASE_ARGS=("${DEFI_CASE_1}")
          [[ -n "${DEFI_CASE_2}" ]] && CASE_ARGS+=("${DEFI_CASE_2}")
          echo "[v4_pca] --cases filter: ${CASE_ARGS[*]}"

          touch "${RUNNER_TEMP}/v4_pca.stamp"

          python3 "${SCRIPT}" \
            --output-dir "${OUTDIR}" \
            --cases "${CASE_ARGS[@]}" \
            --force-fresh \
            2>&1 | tee "${OUTDIR}/run.log"

          COUNT=$(find "${OUTDIR}" -name '*.json' -newer "${RUNNER_TEMP}/v4_pca.stamp" 2>/dev/null | wc -l)
          echo "v4_pca result JSON files (this run): ${COUNT}"
          [[ "${COUNT}" -gt 0 ]] || { echo "::error::hypatiax_defi_benchmark_v4_pca.py produced no result JSON in ${OUTDIR}"; exit 1; }

          # v4_pca is documented to emit this alongside its results; a missing
          # file here usually means --output-dir was parsed but not threaded
          # through to the disclosure writer.
          if [[ -z "$(find "${OUTDIR}" -name 'split_protocol_disclosure.json' -print -quit)" ]]; then
            echo "::warning::split_protocol_disclosure.json not found in ${OUTDIR} - check whether --output-dir reaches the disclosure writer."
          fi

      # ── exp3_nguyen12_consolidated.py: 1-2 named Nguyen equations via TASK_IDS ─
      - name: "Smoke test: exp3_nguyen12_consolidated.py"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESULTS_DIR: "${{ github.workspace }}/${{ env.SMOKE_DIR }}/exp3"
          NGUYEN_SEED: "${{ inputs.nguyen_seed || '42' }}"
          NGUYEN_TEMP: "${{ inputs.temperature || '0.25' }}"
          NGUYEN_TASK_1: "${{ inputs.nguyen_task_1 || 'N1' }}"
          NGUYEN_TASK_2: "${{ inputs.nguyen_task_2 }}"
        run: |
          set -euo pipefail

          SCRIPT="hypatiax/experiments/benchmarks/exp3_nguyen12_consolidated.py"
          OUTDIR="${SMOKE_DIR}/exp3"
          [[ -f "${SCRIPT}" ]] || { echo "::error::${SCRIPT} not found"; exit 1; }

          if ! HELP="$(python3 "${SCRIPT}" --help 2>&1)"; then
            echo "::error::${SCRIPT} --help failed (import-time error?). Output follows:"
            echo "${HELP}"
            exit 1
          fi
          for FLAG in --seed --temperature; do
            grep -q -- "${FLAG}" <<<"${HELP}" \
              || { echo "::error::${SCRIPT} has no ${FLAG} flag"; exit 1; }
          done

          # TASK_IDS is an env var, not a flag, so --help cannot confirm it.
          # Assert the source still reads it - otherwise this step silently
          # runs all 12 equations and blows the 45-minute job timeout.
          grep -qE 'TASK_IDS|SHARD_IDS' "${SCRIPT}" \
            || { echo "::error::${SCRIPT} no longer references TASK_IDS/SHARD_IDS; the per-equation filter is gone and this would run all 12 equations"; exit 1; }

          TASK_ARGS=("${NGUYEN_TASK_1}")
          [[ -n "${NGUYEN_TASK_2}" ]] && TASK_ARGS+=("${NGUYEN_TASK_2}")
          export TASK_IDS="${TASK_ARGS[*]}"

          echo "[exp3] seed=${NGUYEN_SEED} temperature=${NGUYEN_TEMP} TASK_IDS='${TASK_IDS}'"
          echo "[exp3] RESULTS_DIR=${RESULTS_DIR}"

          touch "${RUNNER_TEMP}/exp3.stamp"

          python3 "${SCRIPT}" \
            --seed "${NGUYEN_SEED}" \
            --temperature "${NGUYEN_TEMP}" \
            2>&1 | tee "${OUTDIR}/run.log"

          COUNT=$(find "${OUTDIR}" -name '*.json' -newer "${RUNNER_TEMP}/exp3.stamp" 2>/dev/null | wc -l)
          echo "exp3 result JSON files (this run): ${COUNT}"
          [[ "${COUNT}" -gt 0 ]] || { echo "::error::exp3_nguyen12_consolidated.py produced no result JSON in ${OUTDIR} for seed ${NGUYEN_SEED}, TASK_IDS='${TASK_IDS}'"; exit 1; }

      # ── Diagnostics ─────────────────────────────────────────────────────────
      - name: Locate stray result JSON
        if: always()
        run: |
          set -uo pipefail
          echo "=== JSON written anywhere in the workspace in the last 60 min ==="
          echo "(anything under ${OUT_BASE} but OUTSIDE ${SMOKE_DIR} means the"
          echo " --output-dir / RESULTS_DIR override is being ignored)"
          find "${GITHUB_WORKSPACE}" -name '*.json' -mmin -60 \
            -not -path '*/node_modules/*' \
            -not -path '*/.git/*' \
            -not -path '*/site-packages/*' \
            -printf '%TY-%Tm-%Td %TH:%TM  %p\n' 2>/dev/null \
            | sort -r || true
          echo "================================================================"

      - name: Print summary
        if: always()
        run: |
          set -uo pipefail
          echo "=== Smoke test summary ==="
          find "${SMOKE_DIR}" -type f -name '*.json' 2>/dev/null | sort || true
          echo "==========================="
          echo "--- tail of each run.log ---"
          for LOG in "${SMOKE_DIR}"/*/run.log; do
            [[ -f "${LOG}" ]] || continue
            echo "### ${LOG}"
            tail -n 40 "${LOG}"
            echo
          done

      - name: Upload smoke-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-v4-results
          # OUT_BASE is included deliberately: if a script ignores --output-dir
          # and writes to its own default location, the results are still
          # captured instead of being lost with the runner.
          path: |
            ${{ env.SMOKE_DIR }}
            ${{ env.OUT_BASE }}
          if-no-files-found: warn
          retention-days: 5

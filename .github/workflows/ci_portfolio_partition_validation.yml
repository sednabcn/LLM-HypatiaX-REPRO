name: Portfolio partition validation

on:
  workflow_dispatch:
    inputs:
      partition_seeds:
        description: "Comma-separated independent partition seeds"
        required: false
        default: "11,23,42,77,101"
      model_seed:
        description: "Fixed model seed"
        required: false
        default: "42"
  push:
    branches:
      - audit-master
    paths:
      - "hypatiax/experiments/benchmarks/portfolio_variance_partition_validation.py"
      - "hypatiax/experiments/benchmarks/hypatiax_defi_benchmark_v3c.py"
      - "hypatiax/protocols/**"
      - ".github/workflows/ci_portfolio_partition_validation.yml"
  pull_request:
    paths:
      - "hypatiax/experiments/benchmarks/portfolio_variance_partition_validation.py"
      - "hypatiax/experiments/benchmarks/hypatiax_defi_benchmark_v3c.py"
      - "hypatiax/protocols/**"
      - ".github/workflows/ci_portfolio_partition_validation.yml"

permissions:
  contents: read

jobs:
  portfolio-partition-validation:
    name: Random-holdout partition validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
      PARTITION_SEEDS: ${{ inputs.partition_seeds || '11,23,42,77,101' }}
      MODEL_SEED: ${{ inputs.model_seed || '42' }}
      PARTITION_VALIDATION_OUTPUT: ${{ github.workspace }}/portfolio_variance_random_holdout_validation.json
      HYPOTIAX_DISABLE_HARDCODED: "1"
      HYPOTIAX_DISABLE_PROMPT_HINTS: "1"
      HYPOTIAX_STRICT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy scikit-learn pandas torch python-dotenv anthropic
      - name: Verify package imports
        run: |
          python -c "import hypatiax; from hypatiax.protocols.experiment_protocol_defi import DeFiExperimentProtocol; print('HypatiaX imports OK')"
      - name: Run independent partition validation
        run: |
          python hypatiax/experiments/benchmarks/portfolio_variance_partition_validation.py
      - name: Validate result artifact
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["PARTITION_VALIDATION_OUTPUT"])
          if not path.is_file():
              raise SystemExit(f"Missing validation output: {path}")
          data = json.loads(path.read_text())
          assert data["protocol"]["split_protocol"] == "independent_random_holdout_40_60"
          assert data["protocol"]["split_is_transductive"] is False
          assert data["schema_version"] == 2
          assert data["aggregate"]["n_partitions"] == len(data["results"])
          assert data["aggregate"]["n_partitions"] > 0
          for row in data["results"]:
              assert "train_r2" not in row, "Ambiguous legacy train_r2 field found"
              assert "llm_train_r2" in row
              assert row["test_r2_source"] in {"nn", "llm", "ensemble"}
              assert isinstance(row["success_test_r2_gt_0_99"], bool)
          assert data["aggregate"]["n_success_test_r2_gt_0_99"] == sum(
              row["success_test_r2_gt_0_99"] for row in data["results"]
          )
          print(json.dumps(data["aggregate"], indent=2))
          PY
      - name: Upload validation JSON
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-random-holdout-validation
          path: ${{ github.workspace }}/portfolio_variance_random_holdout_validation.json
          if-no-files-found: error

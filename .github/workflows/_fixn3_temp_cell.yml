# ==============================================================================
#  _fixn3_temp_cell.yml - reusable per-cell runner for
#                          ci_fixn3_seed123_temp_repro.yml
#
#  Not intended to be dispatched directly. Called once per run by a parent
#  workflow which is responsible for expanding the run-index matrix. This
#  version removes the in-workflow arithmetic that GitHub's expression parser
#  rejects and instead accepts `run_index` as an input so the caller can
#  generate a matrix externally (e.g. via `strategy.matrix.run_index`).
#
#  Each job executes `python3 <script_path> --seed <seed> --temperature
#  <temperature> --run-index <run_index>`, uploads the results, and reports
#  pass/fail via the job status.
# ==============================================================================

name: "_fixn3_temp_cell (reusable)"

on:
  workflow_call:
    inputs:
      script_path:
        required: true
        type: string
      experiment_label:
        required: true
        type: string
      temperature:
        required: true
        type: string
      seed:
        required: true
        type: string
      # Keep n_runs optional for informational / display purposes.
      n_runs:
        required: false
        type: string
        default: "1"
      # The caller must provide the specific run index (1..N) so the caller
      # can expand a matrix externally and avoid doing arithmetic in this
      # reusable workflow.
      run_index:
        required: true
        type: string
      dry_run:
        required: false
        type: string
        default: "false"

jobs:
  # Single-run job: the caller expands the matrix and supplies run_index.
  run_single:
    name: "${{ inputs.experiment_label }} · seed ${{ inputs.seed }} · temp=${{ inputs.temperature }} · run=${{ inputs.run_index }}"
    runs-on: ubuntu-latest
    # Single-run-per-job design: the caller (ci_fixn3_seed123_temp_repro.yml)
    # expands a strategy.matrix over run_index, so each invocation of this
    # reusable workflow performs exactly one repeat, not n_runs of them.
    # 240 min covers exp3/exp3b's worst-case ~90 min/repeat (per
    # exp3_nguyen12_hybrid50v_03.py's docstring) with a generous buffer,
    # and — since matrix cells run in parallel, not summed — keeps total
    # wall-clock for the whole workflow well under the 5-hour ceiling
    # (one job's timeout, not n_runs x timeout).
    timeout-minutes: 240

    env:
      RESULTS_DIR: ${{ github.workspace }}/hypatiax/data/results/fixn3_item_ii/${{ inputs.experiment_label }}_seed${{ inputs.seed }}_temp${{ inputs.temperature }}
      EXPERIMENT_SEED: ${{ inputs.seed }}
      PYSR_SEED: ${{ inputs.seed }}
      NN_SEED: ${{ inputs.seed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Set up Julia 1.11
        if: ${{ inputs.dry_run != 'true' }}
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"

      - name: Install experiment dependencies
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          pip install -r requirements.txt

      - name: Validate ANTHROPIC_API_KEY (live round-trip)
        if: ${{ inputs.dry_run != 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          KEY_LEN=${#ANTHROPIC_API_KEY}
          echo "ANTHROPIC_API_KEY present: $([ $KEY_LEN -gt 0 ] && echo YES || echo NO)"
          echo "ANTHROPIC_API_KEY length : ${KEY_LEN} chars"
          if [[ $KEY_LEN -eq 0 ]]; then
            echo "::error::ANTHROPIC_API_KEY secret is empty or unset."
            exit 1
          fi
          python3 "${{ github.workspace }}/config/test_key_status.py"

      - name: Confirm script exists and accepts expected flags
        run: |
          if [[ ! -f "${{ inputs.script_path }}" ]]; then
            echo "::error::${{ inputs.script_path }} not found in repo — check the script_path input."
            exit 1
          fi
          if ! python3 "${{ inputs.script_path }}" --help 2>&1 | grep -q -- "--temperature"; then
            echo "::error::${{ inputs.script_path }} does not expose --temperature. It needs the same [FIX-N3-ii-a]/[FIX-N3-ii-b] CLI additions as exp3_nguyen12_hybrid50v_03.py before this cell can be used."
            exit 1
          fi

      - name: "Run single repeat (seed=${{ inputs.seed }}, temp=${{ inputs.temperature }}, run=${{ inputs.run_index }}/${{ inputs.n_runs }})"
        if: ${{ inputs.dry_run != 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "${RESULTS_DIR}"
          echo "════════════════════════════════════════════════════════════════════════"
          echo "  ${{ inputs.experiment_label }} run ${{ inputs.run_index }}/${{ inputs.n_runs }} — seed=${{ inputs.seed }} temp=${{ inputs.temperature }}"
          echo "  RESULTS_DIR: ${RESULTS_DIR}"
          echo "════════════════════════════════════════════════════════════════════════"
          python3 "${{ inputs.script_path }}" \
            --seed "${{ inputs.seed }}" \
            --temperature "${{ inputs.temperature }}" \
            --run-index "${{ inputs.run_index }}"
          echo "✓ Run ${{ inputs.run_index }} completed successfully"

      - name: Verify results file created
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          ls -lah "${RESULTS_DIR}/" || echo "WARNING: Results directory not found or empty"
          find "${RESULTS_DIR}" -name "*.json" -type f || echo "WARNING: No JSON files found in results directory"

      - name: Dry-run — print planned commands only
        if: ${{ inputs.dry_run == 'true' }}
        run: |
          echo "python3 \"${{ inputs.script_path }}\" --seed \"${{ inputs.seed }}\" --temperature \"${{ inputs.temperature }}\" --run-index \"${{ inputs.run_index }}\""
          echo "dry_run=true — stopping, no benchmark runs performed."

      - name: Upload run results
        if: always()
        uses: actions/upload-artifact@v4.3.6
        with:
          name: fixn3-item-ii-${{ inputs.experiment_label }}-seed${{ inputs.seed }}-temp${{ inputs.temperature }}-run${{ inputs.run_index }}-${{ github.run_id }}
          path: ${{ env.RESULTS_DIR }}
          if-no-files-found: warn
          retention-days: 30

# ==============================================================================
#  _fixn3_temp_cell.yml - reusable per-cell runner for
#                          ci_fixn3_seed123_temp_repro.yml
#
#  Not intended to be dispatched directly. Called once per run by a parent
#  workflow which is responsible for expanding the run-index matrix. This
#  version removes the in-workflow arithmetic that GitHub's expression parser
#  rejects and instead accepts `run_index` as an input so the caller can
#  generate a matrix externally (e.g. via `strategy.matrix.run_index`).
#
#  Each job executes `python3 <script_path> --seed <seed> --temperature
#  <temperature> --run-index <run_index>`, uploads the results, and reports
#  pass/fail via the job status.
# ==============================================================================

name: "_fixn3_temp_cell (reusable)"

on:
  workflow_call:
    inputs:
      script_path:
        required: true
        type: string
      experiment_label:
        required: true
        type: string
      temperature:
        required: true
        type: string
      seed:
        required: true
        type: string
      # [FIX-N3-ii] item (ii) requires "candidate count" to be recorded
      # alongside temperature/solve-rate. This is hypatia.py's get_llm_prior()
      # candidate-sampling width — how many LLM-proposed candidate expressions
      # are drawn per equation before trust-gating/selection, NOT n_runs (the
      # repeat count) and NOT n_total (the 12-equation suite size). Passed to
      # the script as --n-candidates.
      candidate_count:
        required: false
        type: string
        default: "5"
      # Keep n_runs optional for informational / display purposes.
      n_runs:
        required: false
        type: string
        default: "1"
      # The caller must provide the specific run index (1..N) so the caller
      # can expand a matrix externally and avoid doing arithmetic in this
      # reusable workflow.
      run_index:
        required: true
        type: string
      dry_run:
        required: false
        type: string
        default: "false"

permissions:
  contents: write

jobs:
  # Single-run job: the caller expands the matrix and supplies run_index.
  run_single:
    name: "${{ inputs.experiment_label }} · seed ${{ inputs.seed }} · temp=${{ inputs.temperature }} · n_cand=${{ inputs.candidate_count }} · run=${{ inputs.run_index }}"
    runs-on: ubuntu-latest
    # Single-run-per-job design: the caller (ci_fixn3_seed123_temp_repro.yml)
    # expands a strategy.matrix over run_index, so each invocation of this
    # reusable workflow performs exactly one repeat, not n_runs of them.
    # 240 min covers exp3/exp3b's worst-case ~90 min/repeat (per
    # exp3_nguyen12_hybrid50v_03.py's docstring) with a generous buffer,
    # and — since matrix cells run in parallel, not summed — keeps total
    # wall-clock for the whole workflow well under the 5-hour ceiling
    # (one job's timeout, not n_runs x timeout).
    timeout-minutes: 240

    env:
      RESULTS_DIR: ${{ github.workspace }}/hypatiax/data/results/fixn3_item_ii/${{ inputs.experiment_label }}_seed${{ inputs.seed }}_temp${{ inputs.temperature }}
      EXPERIMENT_SEED: ${{ inputs.seed }}
      PYSR_SEED: ${{ inputs.seed }}
      NN_SEED: ${{ inputs.seed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Set up Julia 1.11
        if: ${{ inputs.dry_run != 'true' }}
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"

      - name: Install experiment dependencies
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          pip install -r requirements.txt

      - name: Validate ANTHROPIC_API_KEY (live round-trip)
        if: ${{ inputs.dry_run != 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          KEY_LEN=${#ANTHROPIC_API_KEY}
          echo "ANTHROPIC_API_KEY present: $([ $KEY_LEN -gt 0 ] && echo YES || echo NO)"
          echo "ANTHROPIC_API_KEY length : ${KEY_LEN} chars"
          if [[ $KEY_LEN -eq 0 ]]; then
            echo "::error::ANTHROPIC_API_KEY secret is empty or unset."
            exit 1
          fi
          python3 "${{ github.workspace }}/config/test_key_status.py"

      - name: Confirm script exists and accepts expected flags
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          if [[ ! -f "${{ inputs.script_path }}" ]]; then
            echo "::error::${{ inputs.script_path }} not found in repo — check the script_path input."
            exit 1
          fi
          HELP_OUT=$(python3 "${{ inputs.script_path }}" --help 2>&1)
          if ! echo "$HELP_OUT" | grep -q -- "--temperature"; then
            echo "::error::${{ inputs.script_path }} does not expose --temperature. It needs the same [FIX-N3-ii-a]/[FIX-N3-ii-b] CLI additions as exp3_nguyen12_hybrid50v_03.py before this cell can be used."
            exit 1
          fi
          if ! echo "$HELP_OUT" | grep -q -- "--n-candidates"; then
            echo "::error::${{ inputs.script_path }} does not expose --n-candidates. Item (ii) requires candidate count to be recorded alongside temperature/solve-rate — add this CLI flag ([FIX-N3-ii-c]) to hypatia.py's get_llm_prior() call path before this cell can be used."
            exit 1
          fi

      - name: "Run single repeat (seed=${{ inputs.seed }}, temp=${{ inputs.temperature }}, n_candidates=${{ inputs.candidate_count }}, run=${{ inputs.run_index }}/${{ inputs.n_runs }})"
        if: ${{ inputs.dry_run != 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "${RESULTS_DIR}"
          echo "════════════════════════════════════════════════════════════════════════"
          echo "  ${{ inputs.experiment_label }} run ${{ inputs.run_index }}/${{ inputs.n_runs }} — seed=${{ inputs.seed }} temp=${{ inputs.temperature }} n_candidates=${{ inputs.candidate_count }}"
          echo "  RESULTS_DIR: ${RESULTS_DIR}"
          echo "════════════════════════════════════════════════════════════════════════"
          python3 "${{ inputs.script_path }}" \
            --seed "${{ inputs.seed }}" \
            --temperature "${{ inputs.temperature }}" \
            --n-candidates "${{ inputs.candidate_count }}" \
            --run-index "${{ inputs.run_index }}"
          echo "✓ Run ${{ inputs.run_index }} completed successfully"

      - name: Verify results file created
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          ls -lah "${RESULTS_DIR}/" || echo "WARNING: Results directory not found or empty"
          find "${RESULTS_DIR}" -name "*.json" -type f || echo "WARNING: No JSON files found in results directory"

      # ── Commit and push this run's results directly to the repo ────────────
      # Without this, results only exist as a 30-day CI artifact and are
      # invisible in the repository tree. Up to 20 of these cell jobs
      # (4 cells x 5 run_index each) can be pushing concurrently, so this
      # uses the same pull-rebase / push-with-retry pattern as
      # ci_runner_repro.yml's "Commit and push shard results to repo" step.
      # if: always() so a partial/crashed run still persists whatever JSON
      # it did manage to write before failing.
      - name: Commit and push results to repo
        if: ${{ always() && inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          FILE_COUNT=$(find "${RESULTS_DIR}" -type f 2>/dev/null | wc -l || echo 0)
          echo "Files in ${RESULTS_DIR}: ${FILE_COUNT}"
          if [[ "${FILE_COUNT}" -eq 0 ]]; then
            echo "::warning::No files in ${RESULTS_DIR} — nothing to commit for this run."
            exit 0
          fi

          echo "--- Files to stage ---"
          find "${RESULTS_DIR}" -type f | sort

          commit_and_push() {
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" 2>&1 || {
              echo "::warning::git pull --rebase failed — stashing untracked files and retrying"
              git stash --include-untracked --quiet || true
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" 2>&1 || true
              git stash pop --quiet 2>/dev/null || true
            }

            git add -f "${RESULTS_DIR}"

            if git diff --cached --quiet; then
              echo "Nothing new to commit (results already committed by a prior run)."
              return 0
            fi

            git commit -m "ci: fixn3 item (ii) — ${{ inputs.experiment_label }} seed${{ inputs.seed }} temp${{ inputs.temperature }} run${{ inputs.run_index }} — run ${{ github.run_id }}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          }

          MAX_ATTEMPTS=5
          ATTEMPT=1
          until commit_and_push; do
            if [[ "${ATTEMPT}" -ge "${MAX_ATTEMPTS}" ]]; then
              echo "::error::Failed to commit/push results for ${{ inputs.experiment_label }} seed${{ inputs.seed }} temp${{ inputs.temperature }} run${{ inputs.run_index }} after ${MAX_ATTEMPTS} attempts. Results were computed but NOT persisted to the repo (still available in the uploaded artifact)."
              exit 1
            fi
            ATTEMPT=$((ATTEMPT + 1))
            SLEEP_SECS=$((RANDOM % 15 + 5))
            echo "Push conflict (attempt ${ATTEMPT}/${MAX_ATTEMPTS}) — waiting ${SLEEP_SECS}s then retrying..."
            sleep "${SLEEP_SECS}"
          done

          echo "✓ Committed and pushed results for ${{ inputs.experiment_label }} seed${{ inputs.seed }} temp${{ inputs.temperature }} run${{ inputs.run_index }}"


      - name: Dry-run — print planned commands only
        if: ${{ inputs.dry_run == 'true' }}
        run: |
          echo "python3 \"${{ inputs.script_path }}\" --seed \"${{ inputs.seed }}\" --temperature \"${{ inputs.temperature }}\" --n-candidates \"${{ inputs.candidate_count }}\" --run-index \"${{ inputs.run_index }}\""
          echo "dry_run=true — stopping, no benchmark runs performed."

      - name: Upload run results
        if: always()
        uses: actions/upload-artifact@v4.3.6
        with:
          name: fixn3-item-ii-${{ inputs.experiment_label }}-seed${{ inputs.seed }}-temp${{ inputs.temperature }}-run${{ inputs.run_index }}-${{ github.run_id }}
          path: ${{ env.RESULTS_DIR }}
          if-no-files-found: warn
          retention-days: 30

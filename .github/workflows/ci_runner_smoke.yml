name: HypatiaX - runner smoke

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: "Optional comma-separated smoke stages (blank = all)"
        required: false
        default: ""

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_MODE: offline
      SMOKE_HELP: "0"
      STAGE_TIMEOUT: "300"
      SMOKE_ONLY: ${{ github.event.inputs.only || '' }}

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Install minimal smoke dependency
        run: python -m pip install PyYAML

      - name: Run offline smoke checks
        run: |
          set -euo pipefail
          args=()
          if [[ -n "${SMOKE_ONLY}" ]]; then
            if [[ ! "${SMOKE_ONLY}" =~ ^[a-z_,]+$ ]]; then
              echo "::error::invalid 'only' value: ${SMOKE_ONLY}"
              exit 2
            fi
            args=(--only "${SMOKE_ONLY}")
          fi
          chmod +x ci_runner/run_smoke_all.sh
          ./ci_runner/run_smoke_all.sh --keep-going "${args[@]}"

      - name: Upload smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-outputs
          path: smoke_outputs/
          if-no-files-found: warn
          retention-days: 7

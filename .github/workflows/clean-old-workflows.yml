name: Cleanup Old Workflow Runs
on:
  schedule:
    - cron: '0 2 * * 0'  # Every Sunday at 02:00 UTC
  workflow_dispatch:
    inputs:
      hours_threshold:
        description: 'Delete workflow runs older than this many hours'
        required: false
        default: '72'
        type: string
      apply_deletions:
        description: 'Actually delete eligible runs (manual dispatch only; scheduled runs are always dry-run)'
        required: false
        default: false
        type: boolean

env:
  HYPATIAX_DISABLE_HARDCODED: "1"
  HYPATIAX_DISABLE_PROMPT_HINTS: "1"
  HYPATIAX_R2_SIGN_FLIP: "0"
  HYPATIAX_STRICT: "1"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: write
      contents: read
    steps:
      - name: Cleanup Old Workflow Runs
        uses: actions/github-script@v8
        env:
          HOURS_THRESHOLD: ${{ github.event.inputs.hours_threshold || '72' }}
          APPLY_DELETIONS: ${{ inputs.apply_deletions || false }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN}}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Configuration
            const rawHours = process.env.HOURS_THRESHOLD || '72';
            if (!/^\d+$/.test(rawHours)) throw new Error('hours_threshold must be numeric');
            const KEEP_HOURS = Number(rawHours);
            if (!Number.isSafeInteger(KEEP_HOURS) || KEEP_HOURS < 24 || KEEP_HOURS > 8760) throw new Error('hours_threshold must be an integer from 24 to 8760');
            const APPLY_DELETIONS = context.eventName === 'workflow_dispatch' && process.env.APPLY_DELETIONS === 'true';
            const PROTECTED_BRANCHES = new Set(['audit-master', 'audit-main', 'master']);
            // Preserve scientific/reproducibility history regardless of age or branch.
            // IDs are the current GitHub workflow IDs; name patterns are a fallback
            // if a workflow is recreated and receives a new ID.
            const PRESERVED_WORKFLOW_IDS = new Set([400368487, 315086159]);
            const PRESERVED_WORKFLOW_NAME_PATTERNS = [
              /phase\s*3\s*ablation/i,
              /runner\s*\(repro\)/i
            ];
            const MAX_PAGES = 30;

            console.log('🧹 Starting conservative workflow-run cleanup...');
            console.log(`Mode: ${APPLY_DELETIONS ? 'APPLY' : 'DRY RUN (no runs will be deleted)'}`);
            console.log('Preserving protected branches, experiment/repro workflows, failed runs, and all runs newer than the threshold');
            console.log(`Deleting runs older than ${KEEP_HOURS} hours`);
            console.log(`Repository: ${owner}/${repo}`);
            console.log('================================');

            const cutoffDate = new Date();
            cutoffDate.setHours(cutoffDate.getHours() - KEEP_HOURS);
            console.log(`Cutoff date: ${cutoffDate.toISOString()} (${KEEP_HOURS} hours ago)`);

            let totalDeleted = 0;
            let totalKept = 0;
            let totalProcessed = 0;
            let workflowCount = 0;
            let allRunsAcrossWorkflows = [];

            try {
              // Fetch ALL runs at repo level — catches orphaned runs from renamed/deleted
              // workflow files that won't appear when querying by workflow ID.
              console.log('📋 Fetching all runs across repo (including orphaned)...');

              let page = 1;
              while (page <= MAX_PAGES) {
                try {
                  console.log(`  📖 Fetching page ${page}...`);
                  const { data: runsPage } = await github.rest.actions.listWorkflowRunsForRepo({
                    owner,
                    repo,
                    page,
                    per_page: 100
                  });

                  console.log(`    📊 Got ${runsPage.workflow_runs.length} runs on page ${page}`);

                  if (runsPage.workflow_runs.length === 0) break;

                  const runsWithWorkflow = runsPage.workflow_runs.map(run => ({
                    ...run,
                    workflow_name: run.name || `workflow_${run.workflow_id}`,
                    workflow_id: run.workflow_id
                  }));

                  allRunsAcrossWorkflows = allRunsAcrossWorkflows.concat(runsWithWorkflow);
                  console.log(`    📈 Total runs collected so far: ${allRunsAcrossWorkflows.length}`);

                  page++;
                  await new Promise(resolve => setTimeout(resolve, 100));
                } catch (error) {
                  console.log(`    ❌ Error fetching page ${page}: ${error.message}`);
                  throw error;
                }
              }

              workflowCount = new Set(allRunsAcrossWorkflows.map(r => r.workflow_id)).size;
              totalProcessed = allRunsAcrossWorkflows.length;
              console.log(`\n📊 Total runs collected: ${totalProcessed} across ${workflowCount} workflows`);

              // Sort ALL runs by creation date (newest first)
              allRunsAcrossWorkflows.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

              // Only old, completed successful runs on unprotected branches are eligible.
              // Caps are not deletion criteria: they must never evict recent history.
              const runsToKeep = [];
              const runsToDelete = [];

              for (const run of allRunsAcrossWorkflows) {
                const oldEnough = new Date(run.created_at) <= cutoffDate;
                const successful = run.status === 'completed' && run.conclusion === 'success';
                const protectedBranch = PROTECTED_BRANCHES.has(run.head_branch);
                const protectedWorkflow = PRESERVED_WORKFLOW_IDS.has(run.workflow_id) ||
                  PRESERVED_WORKFLOW_NAME_PATTERNS.some(pattern => pattern.test(run.workflow_name || run.name || ''));
                if (oldEnough && successful && !protectedBranch && !protectedWorkflow) runsToDelete.push(run);
                else runsToKeep.push(run);
              }

              console.log(`\n📊 Will preserve: ${runsToKeep.length}; eligible: ${runsToDelete.length}`);
              if (!APPLY_DELETIONS) {
                console.log('🛡️ Dry-run only: no workflow runs will be deleted.');
              } else {
                const deletesByWorkflow = {};
                for (const run of runsToDelete) {
                  if (!deletesByWorkflow[run.workflow_id]) deletesByWorkflow[run.workflow_id] = [];
                  deletesByWorkflow[run.workflow_id].push(run);
                }
                for (const [workflowId, runs] of Object.entries(deletesByWorkflow)) {
                  const workflowName = runs[0].workflow_name;
                  console.log(`\nDeleting ${runs.length} old successful runs from ${workflowName}`);
                  for (let i = 0; i < runs.length; i += 5) {
                    const batch = runs.slice(i, i + 5);
                    const results = await Promise.allSettled(batch.map(async run => {
                      try { await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id }); return true; }
                      catch (error) { console.log(`Failed to delete run ${run.id}: ${error.message}`); return false; }
                    }));
                    totalDeleted += results.filter(r => r.status === 'fulfilled' && r.value).length;
                    if (i + 5 < runs.length) await new Promise(resolve => setTimeout(resolve, 1000));
                  }
                }
              }
              totalKept = runsToKeep.length;

            } catch (error) {
              console.error('❌ Fatal error during cleanup:', error.message);
              throw error;
            }

            console.log('\n=================================');
            console.log(APPLY_DELETIONS ? '🎉 Cleanup completed!' : '🔎 Dry-run completed; no runs were deleted.');
            console.log('📊 Total summary:');
            console.log(`  • Workflows processed: ${workflowCount}`);
            console.log(`  • Total runs processed: ${totalProcessed}`);
            console.log(`  • Runs kept: ${totalKept}`);
            console.log(`  • Runs deleted: ${totalDeleted}`);
            console.log(`  • Success rate: ${totalProcessed > 0 ? Math.round((totalDeleted + totalKept) / totalProcessed * 100) : 0}%`);

            if (totalDeleted > 10) {
              const issueBody = [
                '## Workflow Cleanup Results',
                '',
                `**Date:** ${new Date().toISOString()}`,
                `**Repository:** ${owner}/${repo}`,
                '',
                '### Summary',
                `- **Workflows processed:** ${workflowCount}`,
                `- **Total runs processed:** ${totalProcessed}`,
                `- **Runs kept:** ${totalKept}`,
                `- **Runs deleted:** ${totalDeleted}`,
                '',
                '### Policy Applied',
                `- Mode: ${APPLY_DELETIONS ? 'apply' : 'dry-run'}`,
                `- Eligible: completed successful runs older than ${KEEP_HOURS} hours on unprotected branches`,
                '- Protected branches: master, audit-main, audit-master',
                '- Preserved workflows: Phase 3 ablation and runner reproduction',
                '- Failed, cancelled, queued, and in-progress runs are preserved',
                '',
                '### Status',
                '✅ Cleanup completed successfully'
              ].join('\n');

              await github.rest.issues.create({
                owner,
                repo,
                title: `🧹 Workflow Cleanup Summary - ${new Date().toISOString().split('T')[0]}`,
                body: issueBody,
                labels: ['maintenance', 'automated']
              });
            }

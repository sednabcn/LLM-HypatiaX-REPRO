name: HypatiaX - authentic fresh rerun

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Explicitly authorize a new live-LLM run. Outputs are uploaded as an artifact and are never committed to the repository."
        required: true
        type: choice
        options:
          - NO
          - RUN_FRESH_EXPERIMENTS
        default: NO

permissions:
  contents: read

concurrency:
  group: hypatiax-authentic-fresh-rerun
  cancel-in-progress: false

env:
  HYPATIAX_DISABLE_HARDCODED: "1"
  HYPATIAX_DISABLE_PROMPT_HINTS: "1"
  HYPATIAX_R2_SIGN_FLIP: "0"
  HYPATIAX_STRICT: "1"
  PYTHONHASHSEED: "0"
  JOB_DEADLINE: "19800"

jobs:
  fresh-rerun:
    if: ${{ inputs.confirm == 'RUN_FRESH_EXPERIMENTS' }}
    name: "Fresh experiments - no historical outputs or cache"
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Set up Julia 1.11
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"

      - name: Install pinned Python environment
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip check
          python - <<'PY'
          from importlib.metadata import version
          expected = {
              "torch": "2.12.1+cpu",
              "anthropic": "0.73.0",
              "numpy": "2.3.5",
              "scipy": "1.16.3",
              "sympy": "1.14.0",
              "pandas": "2.3.3",
              "scikit-learn": "1.7.2",
              "pysr": "2.0.0a1",
              "PyYAML": "6.0.3",
              "pytest-timeout": "2.4.0",
          }
          for package, wanted in expected.items():
              actual = version(package)
              print(f"{package}: {actual}")
              if actual != wanted:
                  raise SystemExit(f"{package}: expected {wanted}, got {actual}")
          PY

      - name: Verify explicit live API credential
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          [[ -n "${ANTHROPIC_API_KEY:-}" ]] || {
            echo "::error::ANTHROPIC_API_KEY is not configured; refusing to run."
            exit 1
          }
          python3 config/check_key_status.py

      - name: Create isolated output location
        run: |
          RESULTS_DIR="${RUNNER_TEMP}/hypatiax-fresh-${GITHUB_RUN_ID}"
          [[ ! -e "$RESULTS_DIR" ]] || {
            echo "::error::Fresh output path already exists; refusing to reuse it."
            exit 1
          }
          echo "RESULTS_DIR=$RESULTS_DIR" >> "$GITHUB_ENV"
          echo "Fresh outputs will be isolated at: $RESULTS_DIR"

      - name: Run primary fresh experiment protocol
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          bash ci_runner/run_fresh_experiments.sh

      - name: Upload raw outputs, logs, manifest, and runtime provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hypatiax-authentic-fresh-run-${{ github.run_id }}
          path: ${{ runner.temp }}/hypatiax-fresh-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 90

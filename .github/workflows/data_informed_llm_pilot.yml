name: "HypatiaX - data-informed LLM-only pilot"
run-name: "Data-informed LLM-only pilot · Allometric Scaling"

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: data-informed-llm-only-pilot
  cancel-in-progress: false

jobs:
  pilot:
    name: "Allometric Scaling · four LLM-only strategies"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HYPATIAX_STRICT: "1"
      HYPATIAX_DISABLE_HARDCODED: "1"
      HYPATIAX_DISABLE_PROMPT_HINTS: "1"
      HYPATIAX_R2_SIGN_FLIP: "0"
      HYPATIAX_LLM_MODEL: "claude-sonnet-4-6"
      LLM_PILOT_CASE_ID: "3"
      LLM_PILOT_OUTPUT_DIR: ${{ github.workspace }}/hypatiax/data/results/data_informed_llm_pilot/run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
      REPRO_CFG: ${{ github.workspace }}/config/repro.yaml
      NO_LLM_CACHE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "pandas==2.2.3" "pysr==2.0.0a1" \
            numpy scipy sympy "anthropic==0.73.0" scikit-learn pyyaml \
            python-dotenv matplotlib seaborn pmlb pint psutil

      - name: Run four LLM-only strategies
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m hypatiax.experiments.benchmarks.run_data_informed_llm_pilot

      - name: Upload pilot diagnostics
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: data-informed-llm-only-pilot-run-${{ github.run_id }}
          path: hypatiax/data/results/data_informed_llm_pilot/run-${{ github.run_id }}-attempt-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 90

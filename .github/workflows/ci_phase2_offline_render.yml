name: Phase 2 offline prompt render

on:
  pull_request:
    paths:
      - "scripts/run_pure_llm_arm.py"
      - "scripts/p2_data.py"
      - "hypatiax/core/base_pure_llm/**"
      - "config/phase2_pure_llm_config.yaml"
      - ".github/workflows/ci_phase2_offline_render.yml"
  push:
    branches: [master]
    paths:
      - "scripts/run_pure_llm_arm.py"
      - "scripts/p2_data.py"
      - "hypatiax/core/base_pure_llm/**"
      - "config/phase2_pure_llm_config.yaml"
      - ".github/workflows/ci_phase2_offline_render.yml"

permissions:
  contents: read

jobs:
  render:
    name: Render Phase 2 prompt without API access
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HYPATIAX_DISABLE_HARDCODED: "1"
      HYPATIAX_DISABLE_PROMPT_HINTS: "1"
      HYPATIAX_R2_SIGN_FLIP: "0"
      HYPATIAX_STRICT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned project dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Render one representative Phase 2 prompt offline
        run: |
          set -uo pipefail
          mkdir -p phase2-offline-render
          set +e
          python scripts/run_pure_llm_arm.py \
            --render "Allometric Scaling" \
            --data-fn scripts.p2_data:generate_case \
            --p-kwargs-out phase2-offline-render/p_request_kwargs.json \
            2>&1 | tee phase2-offline-render/render.log
          render_status=${PIPESTATUS[0]}
          set -e
          test -s phase2-offline-render/p_request_kwargs.json
          python - "${render_status}" <<'PY'
          import pathlib
          import sys
          status = int(sys.argv[1])
          log = pathlib.Path("phase2-offline-render/render.log").read_text()
          failures = [line for line in log.splitlines() if "[FAIL]" in line]
          expected = "[FAIL] A3-2 prompt template hash is pinned and matches"
          if status != 1 or len(failures) != 1 or expected not in failures[0]:
              raise SystemExit(
                  "Offline render failed for a reason other than the intentionally "
                  "un-pinned prompt hash. Inspect the uploaded render.log. "
                  f"exit={status}; failures={failures!r}"
              )
          if "prompt_template_sha256 to pin in config:" not in log:
              raise SystemExit("Render did not emit the candidate template hash.")
          if "Rendered prompt (check it by eye):" not in log:
              raise SystemExit("Render did not emit the prompt for review.")
          print("Offline render succeeded; only the intentionally unpinned hash gate remains.")
          PY
      - name: Upload rendered prompt and request snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-offline-prompt-render
          path: phase2-offline-render/
          if-no-files-found: error
          retention-days: 14

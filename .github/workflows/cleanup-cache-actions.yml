name: Delete all caches

on:
  workflow_dispatch:  # run manually from GitHub UI

permissions:
  actions: write
  contents: read

env:
  HYPATIAX_DISABLE_HARDCODED: "1"
  HYPATIAX_DISABLE_PROMPT_HINTS: "1"
  HYPATIAX_R2_SIGN_FLIP: "0"
  HYPATIAX_STRICT: "1"

jobs:
  cleanup:
    runs-on: ubuntu-latest  # missing
    steps:                   # missing
      - name: Delete all caches
        run: gh cache delete --all -R sednabcn/LLM-HypatiaX-PAPERS-Public || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


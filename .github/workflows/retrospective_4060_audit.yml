name: Retrospective DeFi 40/60 symbolic audit

on:
  pull_request:
    paths:
      - "scripts/analysis/audit_4060_reusable.py"
      - ".github/workflows/retrospective_4060_audit.yml"
      - "hypatiax/experiments/audit/**"
      - "hypatiax/experiments/symbolic_equivalence.py"
      - "hypatiax/data/results/comparison_results/noise-noiseless/noiseless/defi_random_4060/**"
      - "hypatiax/data/results/comparison_results/noise-noiseless/noiseless/defi_pca/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrospective-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install symbolic audit dependency
        run: python -m pip install "numpy==2.3.5" "sympy==1.14.0"
      - name: Run offline retrospective audit
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/analysis/audit_4060_reusable.py \
            --output-json /tmp/defi-4060-retrospective-audit.json \
            --output-md /tmp/defi-4060-retrospective-audit.md
          cat /tmp/defi-4060-retrospective-audit.md
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: defi-4060-retrospective-audit
          path: |
            /tmp/defi-4060-retrospective-audit.json
            /tmp/defi-4060-retrospective-audit.md
          if-no-files-found: error
          retention-days: 30

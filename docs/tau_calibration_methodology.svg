<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs><linearGradient id="navy" x2="0" y2="1"><stop stop-color="#163b67"/><stop offset="1" stop-color="#09264a"/></linearGradient><linearGradient id="pale" x2="0" y2="1"><stop stop-color="#edf5ff"/><stop offset="1" stop-color="#fff"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#1764ad"/></marker></defs>
<rect width="1600" height="1000" fill="#f5f8fc"/><rect x="24" y="18" width="1552" height="76" rx="14" fill="url(#navy)"/><text x="800" y="66" text-anchor="middle" fill="white" font-family="Arial" font-size="36" font-weight="bold">Calibrating the LLM Routing Threshold (τ) in HypatiaX</text>
<text x="800" y="132" text-anchor="middle" fill="#12345a" font-family="Arial" font-size="25" font-weight="bold">MEASURE  →  CALIBRATE  →  FREEZE  →  VALIDATE</text>
<g font-family="Arial" fill="#102b4e">
<g><rect x="25" y="165" width="240" height="390" rx="14" fill="url(#pale)" stroke="#1764ad" stroke-width="2"/><circle cx="58" cy="202" r="22" fill="#163b67"/><text x="58" y="210" text-anchor="middle" fill="white" font-size="24" font-weight="bold">1</text><text x="91" y="208" font-size="22" font-weight="bold">Equation families</text><text x="48" y="258" font-size="19">Define scope and strata:</text><text x="50" y="300" font-size="18">• Continuous surfaces</text><text x="50" y="340" font-size="18">• Piecewise functions</text><text x="50" y="380" font-size="18">• Discrete / integer-grid</text><text x="50" y="420" font-size="18">• Other declared domains</text><rect x="45" y="465" width="200" height="65" rx="10" fill="#e1edfb"/><text x="145" y="492" text-anchor="middle" font-size="17" font-weight="bold">Provenance +</text><text x="145" y="516" text-anchor="middle" font-size="17" font-weight="bold">family review</text></g>
<path d="M270 360H295" stroke="#1764ad" stroke-width="5" marker-end="url(#arr)"/>
<g><rect x="305" y="165" width="240" height="390" rx="14" fill="url(#pale)" stroke="#1764ad" stroke-width="2"/><circle cx="338" cy="202" r="22" fill="#163b67"/><text x="338" y="210" text-anchor="middle" fill="white" font-size="24" font-weight="bold">2</text><text x="371" y="208" font-size="22" font-weight="bold">Measure ΔLLM</text><text x="330" y="258" font-size="19">For each family:</text><rect x="325" y="280" width="200" height="72" rx="10" fill="#fff0c7"/><text x="425" y="323" text-anchor="middle" font-size="23" font-weight="bold">Δ = R²core − R²edge</text><text x="335" y="394" font-size="18">Example:</text><rect x="350" y="418" width="55" height="88" fill="#377fca"/><rect x="435" y="443" width="55" height="63" fill="#ef9847"/><text x="377" y="411" text-anchor="middle" font-size="18">0.98</text><text x="462" y="436" text-anchor="middle" font-size="18">0.70</text><text x="377" y="532" text-anchor="middle" font-size="16">Core</text><text x="462" y="532" text-anchor="middle" font-size="16">Edge</text></g>
<path d="M550 360H575" stroke="#1764ad" stroke-width="5" marker-end="url(#arr)"/>
<g><rect x="585" y="165" width="240" height="390" rx="14" fill="url(#pale)" stroke="#1764ad" stroke-width="2"/><circle cx="618" cy="202" r="22" fill="#163b67"/><text x="618" y="210" text-anchor="middle" fill="white" font-size="24" font-weight="bold">3</text><text x="651" y="208" font-size="22" font-weight="bold">Calibrate τ</text><text x="610" y="258" font-size="19">Calibration cohort only.</text><rect x="610" y="285" width="190" height="82" rx="10" fill="#fff0c7"/><text x="705" y="319" text-anchor="middle" font-size="18" font-weight="bold">Predefined criterion</text><text x="705" y="345" text-anchor="middle" font-size="16">cost / risk / quality</text><path d="M620 480Q680 475 700 405Q720 475 790 480" fill="#d7e8ff" stroke="#1764ad" stroke-width="3"/><path d="M725 390V490" stroke="#c33" stroke-width="3" stroke-dasharray="8 6"/><text x="735" y="388" fill="#b22" font-size="20" font-weight="bold">τ</text><text x="705" y="523" text-anchor="middle" font-size="17">Quantify uncertainty</text></g>
<path d="M830 360H855" stroke="#1764ad" stroke-width="5" marker-end="url(#arr)"/>
<g><rect x="865" y="165" width="210" height="390" rx="14" fill="url(#pale)" stroke="#1764ad" stroke-width="2"/><circle cx="898" cy="202" r="22" fill="#163b67"/><text x="898" y="210" text-anchor="middle" fill="white" font-size="24" font-weight="bold">4</text><text x="931" y="208" font-size="22" font-weight="bold">Freeze τ</text><text x="890" y="270" font-size="20">Lock threshold</text><text x="890" y="300" font-size="20">before evaluation.</text><rect x="890" y="345" width="160" height="85" rx="10" fill="#fff0c7"/><text x="970" y="395" text-anchor="middle" font-size="30" font-weight="bold">τ = fixed</text><text x="970" y="480" text-anchor="middle" font-size="19">No retuning</text><text x="970" y="507" text-anchor="middle" font-size="19">on test families</text></g>
<path d="M1080 360H1105" stroke="#1764ad" stroke-width="5" marker-end="url(#arr)"/>
<g><rect x="1115" y="165" width="220" height="390" rx="14" fill="url(#pale)" stroke="#1764ad" stroke-width="2"/><circle cx="1148" cy="202" r="22" fill="#163b67"/><text x="1148" y="210" text-anchor="middle" fill="white" font-size="24" font-weight="bold">5</text><text x="1181" y="208" font-size="22" font-weight="bold">Evaluate</text><text x="1140" y="260" font-size="19">Unseen families:</text><text x="1140" y="310" font-size="18">✓ Routing accuracy</text><text x="1140" y="350" font-size="18">✓ False acceptance</text><text x="1140" y="390" font-size="18">✓ Fallback frequency</text><text x="1140" y="430" font-size="18">✓ Cost and edge score</text><rect x="1135" y="470" width="180" height="55" rx="9" fill="#d9f5df"/><text x="1225" y="504" text-anchor="middle" font-size="18" font-weight="bold">Independent test</text></g>
<path d="M1340 360H1365" stroke="#1764ad" stroke-width="5" marker-end="url(#arr)"/>
<g><rect x="1375" y="165" width="200" height="390" rx="14" fill="url(#pale)" stroke="#1764ad" stroke-width="2"/><circle cx="1408" cy="202" r="22" fill="#163b67"/><text x="1408" y="210" text-anchor="middle" fill="white" font-size="24" font-weight="bold">6</text><text x="1441" y="208" font-size="22" font-weight="bold">Report</text><text x="1400" y="270" font-size="19">Document:</text><text x="1400" y="315" font-size="18">• Frozen τ</text><text x="1400" y="355" font-size="18">• Uncertainty</text><text x="1400" y="395" font-size="18">• Stratum results</text><text x="1400" y="435" font-size="18">• Limitations</text><text x="1400" y="475" font-size="18">• Reproducibility</text></g>
<rect x="25" y="590" width="490" height="175" rx="14" fill="#eaf3ff" stroke="#1764ad" stroke-width="2"/><text x="50" y="630" font-size="26" font-weight="bold">Mathematical foundation</text><text x="50" y="674" font-size="20">Functions share a declared domain and codomain.</text><text x="50" y="710" font-size="20">Linear independence ≠ family independence.</text><text x="50" y="744" font-size="18">Duplicates, equivalent forms, generators, strata.</text>
<rect x="535" y="590" width="530" height="175" rx="14" fill="#fff5dc" stroke="#d69a27" stroke-width="2"/><text x="560" y="630" font-size="26" font-weight="bold">Routing rule (conceptual)</text><text x="565" y="682" font-size="23">ΔLLM ≤ τ  →  LLM route may be acceptable</text><text x="565" y="727" font-size="23">ΔLLM &gt; τ  →  consider alternative solver</text>
<rect x="1085" y="590" width="490" height="175" rx="14" fill="#edf8f0" stroke="#28934a" stroke-width="2"/><text x="1110" y="630" font-size="26" font-weight="bold">Key advantages</text><text x="1110" y="674" font-size="20">Scientific validity • diversity • generalization</text><text x="1110" y="710" font-size="20">Interpretability • reproducibility • cost awareness</text>
<rect x="25" y="795" width="760" height="150" rx="14" fill="#e8f7ed" stroke="#28934a" stroke-width="2"/><text x="50" y="835" font-size="27" font-weight="bold" fill="#176b35">Advantages</text><text x="50" y="880" font-size="20">Prevents circular evaluation • supports out-of-family validation</text><text x="50" y="916" font-size="20">Makes the decision rule auditable and reproducible</text>
<rect x="805" y="795" width="770" height="150" rx="14" fill="#fff0f0" stroke="#c43a3a" stroke-width="2"/><text x="830" y="835" font-size="27" font-weight="bold" fill="#a52222">Limitations and risks</text><text x="830" y="880" font-size="20">Family labels can be uncertain • small cohorts widen uncertainty</text><text x="830" y="916" font-size="20">Domain/model shifts matter • R² alone may be insufficient</text>
<text x="800" y="980" text-anchor="middle" font-family="Arial" font-size="17" fill="#4b6078">τ is a calibrated decision threshold, not a prediction model. Calibration and evaluation must use disjoint equation families.</text>
</g></svg>